function toggleSess(){DB.set('sess_open_'+TODAY,DB.get('sess_open_'+TODAY)!==true);renderToday();}
/* Swap one exercise for the next option that trains the same muscle. */
function swapExercise(id){
  const d=sessionDraft(),e=EX_DB[id];
  if(!e)return;
  const pool=Object.entries(EX_DB).filter(([k,x])=>
    x.muscle===e.muscle&&k!==id&&!isExcluded(k)&&x.neck_ok!==false&&!x.timeBased&&!d.ids.includes(k)
  ).map(([k])=>k);
  if(!pool.length)return toast('No alternative for '+e.muscle+' right now');
  const next=pool[(DB.get('swap_'+id)||0)%pool.length];
  DB.set('swap_'+id,(DB.get('swap_'+id)||0)+1);
  d.ids=d.ids.map(x=>x===id?next:x);
  delete d.marks[id];
  if(d.actuals)delete d.actuals[id];
  saveDraft();renderToday();
  toast(e.name+' \u2192 '+EX_DB[next].name);
}
function setType(t){DB.set('manual_session_type_'+TODAY,t);SESS=null;DB.del('draft_'+TODAY);renderAll();}
function markSet(id,i){
  const d=sessionDraft();
  d.marks[id]=d.marks[id]||{};
  d.marks[id][i]=!d.marks[id][i];
  saveDraft();
  renderSession();
  if(d.marks[id][i])startRest(id);
}
/* ═══ GUIDED WORKOUT ═══
   One exercise at a time, big buttons, countdown and chime. */
let G={plan:[],i:0,left:0,timer:null,running:false};

function guideBuild(){
  const d=sessionDraft(),plan=[];
  let warm=0;
  d.ids.forEach((id,ei)=>{
    const t=targetFor(id),e=EX_DB[id];
    const secs=parseInt((String(t.reps).match(/^([0-9]+)s/)||[])[1]||'0',10);
    const begun=Object.values(d.marks[id]||{}).some(Boolean);
    // one light set before each of the first two loaded lifts; it is not logged
    if(e.muscle!=='core'&&!e.bw&&t.kg>=6&&warm<2){
      warm++;
      if(!begun)plan.push({kind:'warm',id,target:Math.max(2,Math.round(t.kg*0.6*2)/2)+' kg × 8'});
    }
    for(let sN=0;sN<t.sets;sN++){
      plan.push({kind:'work',id,set:sN+1,sets:t.sets,secs,target:(t.kg?t.kg+' kg × ':'')+t.reps});
      const lastOverall=(ei===d.ids.length-1)&&(sN===t.sets-1);
      if(!lastOverall)plan.push({kind:'rest',id,sec:restFor(id)});
    }
  });
  return plan;
}
function startGuide(){
  G.plan=guideBuild();
  if(!G.plan.length)return toast('No exercises today');
  const d=sessionDraft();
  if(!d.t0){d.t0=Date.now();saveDraft();}
  // pick up where he left off: the first set that is not ticked yet
  let i=G.plan.findIndex(s=>s.kind==='work'&&!(d.marks[s.id]&&d.marks[s.id][s.set-1]));
  if(i>0&&G.plan[i-1].kind==='warm'&&G.plan[i-1].id===G.plan[i].id)i--;
  G.i=i<0?G.plan.length:i;G.done=false;
  el('guide').classList.add('on');
  keepAwake(true);getCtx();
  if(G.i>=G.plan.length)return guideFinish();
  guideShow();
}
function guideShow(){
  clearInterval(G.timer);G.running=false;cancelAlarm();G.done=false;
  const s=G.plan[G.i];
  if(!s)return guideFinish();
  const e=EX_DB[s.id];
  el('g-fill').style.width=Math.round((G.i/G.plan.length)*100)+'%';
  el('g-step').textContent='Step '+(G.i+1)+' of '+G.plan.length;
  if(s.kind==='rest'){
    el('g-phase').textContent='Rest';el('g-phase').className='g-phase rest';
    el('g-name').textContent='Breathe';
    const nxt=G.plan[G.i+1];
    el('g-note').textContent=nxt?'Next: '+EX_DB[nxt.id].name+(nxt.kind==='warm'?' · warm-up':' · set '+nxt.set+' of '+nxt.sets):'Last one done';
    el('g-target').textContent='';
    G.left=s.sec;el('g-clock').textContent=fmt(G.left);
    // the rest starts itself: it used to wait for a tap after every set
    guideMain();
    return;
  }
  const d=sessionDraft();
  const begun=Object.values(d.marks[s.id]||{}).some(Boolean);
  const swap=begun?'':'<div style="margin-top:14px"><button class="lnk" onclick="guideSwap()">Swap this exercise</button></div>';
  if(s.kind==='warm'){
    el('g-phase').textContent='Warm-up';el('g-phase').className='g-phase rest';
    el('g-name').textContent=e.name;
    el('g-note').textContent='One easy set to groove the movement. It is not logged.';
    el('g-target').innerHTML=h(s.target)+swap;
    el('g-clock').textContent='';el('g-main').textContent='Done ✓';
    return;
  }
  el('g-phase').textContent='Set '+s.set+' of '+s.sets;el('g-phase').className='g-phase';
  el('g-name').textContent=e.name;
  const ll=lastLine(s.id),hint=s.set===1?progressionHint(s.id):null;
  el('g-note').innerHTML=h(e.note||'')+
    (hint?'<div style="color:var(--green);font-size:12px;margin-top:8px">'+h(hint)+'</div>':'')+
    (ll?'<div style="color:var(--t3);font-size:12px;margin-top:7px">'+h(ll)+'</div>':'');
  const a=actual(s.id,s.set-1);
  const unit=a.timed?'Seconds':(/steps/.test(String(s.target))?'Steps':'Reps done');
  const wl=(e.eq||[]).indexOf('pulley')>=0?'On the pulley':'Per dumbbell';
  el('g-target').innerHTML='<div class="muted">planned '+h(s.target)+' · stop 1–3 reps short of failure</div><div class="g-adj">'+
    (a.kg?field(wl,'kg',a.kg.toFixed(1),'kg'):'')+field(unit,'reps',a.reps,'')+'</div>'+swap;
  if(a.timed){G.left=a.reps;el('g-clock').textContent=fmt(G.left);el('g-main').textContent='Start '+a.reps+'s';}
  else{el('g-clock').textContent='';el('g-main').textContent='Set done ✓';}
}
function guideMain(){
  if(G.done)return guideSave();
  const s=G.plan[G.i];
  if(!s)return;
  if(s.kind==='warm')return guideNext();
  const a=s.kind==='work'?actual(s.id,s.set-1):null;
  const timed=(s.kind==='rest')||(s.kind==='work'&&a&&a.timed);
  if(!timed){markGuideSet(s);return guideNext();}
  if(G.running){clearInterval(G.timer);G.running=false;cancelAlarm();el('g-main').textContent='Resume';return;}
  const secs=G.left||(s.kind==='rest'?s.sec:a.reps);
  G.left=secs;G.running=true;
  const ok=scheduleAlarm(secs);
  const end=deadline;
  el('g-main').textContent=s.kind==='rest'?'Pause rest':'Pause';
  G.timer=setInterval(()=>{
    G.left=Math.max(0,Math.ceil((end-Date.now())/1000));
    el('g-clock').textContent=fmt(G.left);
    if(Date.now()>=end){
      clearInterval(G.timer);G.running=false;
      if(!ok)beepNow();
      if(navigator.vibrate)navigator.vibrate([300,100,300]);
      releaseAlarm();
      if(s.kind==='work')markGuideSet(s);
      setTimeout(()=>{if(G.plan[G.i]===s)guideNext();},900);
    }
  },200);
}
function markGuideSet(s){
  const d=sessionDraft();
  d.marks[s.id]=d.marks[s.id]||{};
  d.marks[s.id][s.set-1]=true;
  saveDraft();
}
function guideNext(manual){
  clearInterval(G.timer);G.running=false;
  if(manual)cancelAlarm();else releaseAlarm();
  G.left=0;
  G.i=Math.min(G.plan.length,G.i+1);
  if(G.i>=G.plan.length)return guideFinish();
  guideShow();
}
function guidePrev(){
  clearInterval(G.timer);G.running=false;cancelAlarm();G.left=0;G.done=false;
  G.i=Math.max(0,Math.min(G.plan.length,G.i)-1);guideShow();
}
/* Swap from inside the workout, as long as no set of the lift is ticked. */
function guideSwap(){
  const s=G.plan[G.i];
  if(!s||s.kind==='rest')return;
  const d=sessionDraft();
  if(Object.values(d.marks[s.id]||{}).some(Boolean))return toast('Sets already ticked — finish or skip this one');
  const before=d.ids.slice();
  swapExercise(s.id);
  const nid=sessionDraft().ids.filter(x=>before.indexOf(x)<0)[0];
  if(!nid)return;
  G.plan=guideBuild();
  G.i=Math.max(0,G.plan.findIndex(x=>x.id===nid));
  guideShow();
}
/* The last set used to end in a toast. Now it ends on what he did, how
   long it took, and what the log says for next time. */
function guideFinish(){
  clearInterval(G.timer);G.running=false;cancelAlarm();
  G.done=true;G.i=G.plan.length;
  const d=sessionDraft();
  let done=0,tot=0;
  d.ids.forEach(id=>{tot+=targetFor(id).sets;done+=Object.values(d.marks[id]||{}).filter(Boolean).length;});
  const mins=d.t0?Math.max(1,Math.round((Date.now()-d.t0)/60000)):0;
  const lines=d.ids.filter(id=>EX_DB[id]&&EX_DB[id].muscle!=='core').map(id=>{
    const t=targetFor(id),e=EX_DB[id],sets=[];
    for(let i=0;i<t.sets;i++)if(d.marks[id]&&d.marks[id][i]){const a=actual(id,i);sets.push({done:true,kg:a.kg,reps:a.reps});}
    const j=sets.length?judge(id,sets,t.sets):null;
    const txt=!j?'not done':j.up?(e.bw?'top of the range reached':'next time '+j.kg+' kg')
      :(e.bw?'one more rep per set':'stay at '+j.kg+' kg');
    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);text-align:left">'+
      '<span style="font-size:12px">'+h(e.name)+'</span>'+
      '<span style="font-size:12px;text-align:right;color:'+(j&&j.up?'var(--green)':'var(--t2)')+'">'+h(txt)+'</span></div>';
  }).join('');
  el('g-fill').style.width='100%';
  el('g-step').textContent='Finished';
  el('g-phase').textContent=typeName(d.type);el('g-phase').className='g-phase';
  el('g-name').textContent=done+' of '+tot+' sets'+(mins?' · '+mins+' min':'');
  el('g-note').textContent='';
  el('g-target').innerHTML='<div style="max-width:340px;margin:0 auto">'+lines+'</div>';
  el('g-clock').textContent='';
  el('g-main').textContent='Save session ✓';
  beepNow();
}
function guideSave(){
  G.done=false;keepAwake(false);
  el('guide').classList.remove('on');
  saveSession();
}
function guideExit(){
  clearInterval(G.timer);G.running=false;G.done=false;cancelAlarm();keepAwake(false);
  el('guide').classList.remove('on');
  renderToday();
  toast('Paused — your ticked sets are kept');
}

/* Timed exercises (planks, holds, carries) get their own countdown. */
function runHold(id,secs){
  const e=EX_DB[id];
  const ok=scheduleAlarm(secs);keepAwake(true);
  if(!ok)setTimeout(beepNow,secs*1000);
  openSheet('<div style="padding:0 20px 24px;text-align:center">'+
    '<div class="muted" style="letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Hold</div>'+
    '<div style="font-size:17px;margin-bottom:4px">'+h(e.name)+'</div>'+
    '<div class="muted" style="margin-bottom:10px">'+h(e.note||'')+'</div>'+
    '<div class="clock" id="hold-clock" style="font-size:58px">'+fmt(secs)+'</div>'+
    '<button class="btn btn-go" style="width:100%;margin:12px 0 0" onclick="endHold(true)">Done \u2713</button>'+
    '<button class="btn btn-quiet" style="width:100%;margin:6px 0 0" onclick="endHold(false)">Cancel</button></div>');
  window._holdId=id;
  clearInterval(window._hold);
  window._hold=setInterval(()=>{
    const left=Math.max(0,Math.round((deadline-Date.now())/1000));
    const c=el('hold-clock');if(c)c.textContent=fmt(left);
    if(left<=0){clearInterval(window._hold);if(c)c.textContent='0:00';releaseAlarm();if(navigator.vibrate)navigator.vibrate([300,100,300]);}
  },250);
}
function endHold(done){
  clearInterval(window._hold);cancelAlarm();keepAwake(false);closeSheet();
  if(!done)return;
  const id=window._holdId,d=sessionDraft();
  d.marks[id]=d.marks[id]||{};
  const t=targetFor(id);
  for(let i=0;i<t.sets;i++){if(!d.marks[id][i]){d.marks[id][i]=true;break;}}
  saveDraft();renderSession();startRest(id);
}
function restFor(id){
  const base=(DB.get('settings')||{restSec:90}).restSec||90;
  const e=EX_DB[id];
  return (e&&e.muscle==='core')?Math.round(base*0.66):base;
}
function startRest(id){
  const sec=id?restFor(id):((DB.get('settings')||{restSec:90}).restSec||90);
  const ok=scheduleAlarm(sec);keepAwake(true);
  const t=el('rest-timer');if(!t)return;
  t.innerHTML='<div class="card"><div class="clock" id="rt">'+fmt(sec)+'</div>'+
    '<button class="btn btn-quiet" style="width:100%;margin:0" onclick="stopRest()">Skip rest</button></div>';
  clearInterval(window._rt);
  const end=deadline;
  window._rt=setInterval(()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const e=el('rt');if(e)e.textContent=fmt(left);
    if(Date.now()>=end){
      clearInterval(window._rt);
      if(!ok)beepNow();                 // scheduling failed: sound it now
      if(navigator.vibrate)navigator.vibrate([300,100,300]);
      releaseAlarm();                   // let the scheduled chime finish
      keepAwake(false);
      const w=el('rest-timer');if(w)w.innerHTML='';
    }
  },200);
}
function stopRest(){clearInterval(window._rt);cancelAlarm();keepAwake(false);const t=el('rest-timer');if(t)t.innerHTML='';}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function saveSession(){
  const d=sessionDraft();
  // "Log without guiding" with nothing ticked means: done as planned
  const none=!Object.values(d.marks||{}).some(m=>Object.values(m||{}).some(Boolean));
  const ex={};
  d.ids.forEach(id=>{
    const t=targetFor(id),arr=[];
    for(let i=0;i<t.sets;i++){
      const a=(d.actuals&&d.actuals[id]&&d.actuals[id][i])||null;
      arr.push({done:none||!!(d.marks[id]&&d.marks[id][i]),
        reps:a?a.reps:(parseInt(String(t.reps))||0), kg:a?a.kg:t.kg});
    }
    ex[id]=arr;
  });
  // one entry per session a day: 6 July was in the log twice
  const log=(DB.get('session_log')||[]).filter(s=>!(s.date===TODAY&&s.type===d.type&&!s.skipped));
  const rec={date:TODAY,type:d.type,exercises:ex,hrv:S.hrv||null,ts:Date.now()};
  if(d.t0)rec.min=Math.max(1,Math.round((Date.now()-d.t0)/60000));
  log.push(rec);
  DB.set('session_log',log);
  const pw=DB.get('prev_weights')||{};
  d.ids.forEach(id=>{
    // the top set you actually completed, not whatever set one happened to be
    const done=(ex[id]||[]).filter(x=>x.done&&x.kg>0).map(x=>x.kg);
    const kg=done.length?Math.max.apply(null,done):targetFor(id).kg;
    if(kg)pw[id]=kg;
  });
  DB.set('prev_weights',pw);
  DB.del('draft_'+TODAY);SESS=null;stopRest();
  toast('Session logged');renderAll();
}
function overrideRest(){
  DB.set('override_rest_'+TODAY,true);
  derive();renderToday();
  toast('Training anyway — one set less');
}
/* ═══ 18. AEROBIC UI ═══ */

      '<div class="note" style="margin:0 0 12px;border-color:rgba(248,113,113,.2);background:var(--rd)"><b style="color:var(--red);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Stop on</b><span class="muted">'+ROPE_STOP.map(x=>'· '+x).join('<br>')+'</span></div>':'')+
    '<div class="clock" id="ae-clock">'+fmt(aeroMode==='rope'?rope.work:aeroMode==='jogwalk'?jog.walk:
       aeroMode==='jog'?jogMinutes()*60:mins*60)+'</div>'+

function aeroDone(){
  clearInterval(aeroTimer);aeroRunning=false;keepAwake(false);stopKeepAlive();
  const s=el('ae-sub');if(s)s.textContent='complete';
  const b=el('ae-btn');if(b)b.textContent='Start';
  aeroLeft=0;toast('Block complete \u2014 log it');
}
function aeroReset(){
  clearInterval(aeroTimer);aeroRunning=false;cancelAlarm();stopKeepAlive();
  aeroLeft=0;ropeSet=1;ropePhase='work';keepAwake(false);
  renderAerobic();
}
function setAero(k){aeroReset();aeroMode=k;renderAerobic();}
function aeroToggle(){
  const b=el('ae-btn'),M=AERO_MODES[aeroMode];
  if(aeroRunning){clearInterval(aeroTimer);aeroRunning=false;cancelAlarm();if(b)b.textContent='Resume';return;}
  const rope=ropeProtocol();
  const jog=jogProtocol();
  if(!aeroLeft){
    aeroLeft=aeroMode==='rope'?rope.work:aeroMode==='jogwalk'?jog.walk
      :aeroMode==='jog'?jogMinutes()*60:aeroMinutes()*60;
  }
  aeroRunning=true;if(b)b.textContent='Pause';keepAwake(true);startKeepAlive();
  let ok;
  if(aeroMode==='jogwalk'&&ropeSet===1&&ropePhase==='work'){
    // whole walk/jog sequence in one go
    const steps=[];
    for(let r=1;r<=jog.rounds;r++){
      steps.push({sec:jog.walk,double:true});          // walk ends -> start jogging
      steps.push({sec:jog.jog,double:false});          // jog ends -> back to walking
    }
    ok=schedulePlan(steps);
    deadline=Date.now()+jog.walk*1000;
  } else {
    ok=scheduleAlarm(aeroLeft);
  }
  let end=deadline;
  aeroTimer=setInterval(()=>{
    aeroLeft=Math.max(0,Math.ceil((end-Date.now())/1000));
    const c=el('ae-clock');if(c)c.textContent=fmt(aeroLeft);
    if(Date.now()<end)return;
    clearInterval(aeroTimer);
    if(!ok)beepNow();
    if(navigator.vibrate)navigator.vibrate([300,100,300]);
    releaseAlarm();
    const sub=el('ae-sub');
    if(aeroMode==='jogwalk'){
      if(ropePhase==='work'){
        ropePhase='rest';aeroLeft=jog.jog;
        if(sub)sub.textContent='JOG \u00B7 round '+ropeSet+' of '+jog.rounds;
      }else{
        if(ropeSet>=jog.rounds){aeroRunning=false;return aeroDone();}
        ropeSet++;ropePhase='work';aeroLeft=jog.walk;
        if(sub)sub.textContent='walk \u00B7 round '+ropeSet+' of '+jog.rounds;
      }
      // audio for the whole session is already scheduled; just move the clock
      deadline=Date.now()+aeroLeft*1000;end=deadline;
      if(navigator.vibrate)navigator.vibrate(ropePhase==='rest'?[200,80,200]:[400]);
    }else if(aeroMode==='rope'){
      if(ropePhase==='work'){
        if(ropeSet>=rope.sets){aeroRunning=false;return aeroDone();}
        ropePhase='rest';aeroLeft=rope.rest;
        if(sub)sub.textContent='rest \u00B7 next block '+(ropeSet+1)+' of '+rope.sets;
      }else{
        ropeSet++;ropePhase='work';aeroLeft=rope.work;
        if(sub)sub.textContent='block '+ropeSet+' of '+rope.sets;
      }
      aeroRunning=false;aeroToggle();
    }else{aeroRunning=false;aeroDone();}
  },200);
}
function aeroSave(){
  const rope=ropeProtocol();
  const jog=jogProtocol();
  const mins=aeroMode==='rope'?Math.round(rope.sets*(rope.work+rope.rest)/60)
    :aeroMode==='jogwalk'?Math.round(jog.rounds*(jog.walk+jog.jog)/60)
    :aeroMode==='jog'?jogMinutes()
    :aeroMinutes();
  openSheet('<div style="padding:0 20px"><div style="font-size:15px;margin-bottom:6px">Anything flare up?</div>'+
    '<div class="muted" style="margin-bottom:16px">Heaviness, bearing down, urgency or leakage — during or right after the block.</div>'+
    '<div style="display:flex;gap:8px"><button class="btn" style="width:auto;flex:1;margin:0" onclick="aeroConfirm(false,'+mins+')">No</button>'+
    '<button class="btn" style="width:auto;flex:1;margin:0;background:var(--yd);border-color:rgba(251,191,36,.35);color:var(--yellow)" onclick="aeroConfirm(true,'+mins+')">Yes</button></div></div>');
}

/* ═══ BREATHING ═══
   Four seconds in, six out, through the nose: the one routine he already
   does twice a day, and the app had the timer and the sound for it but
   no place to do it. Each session is logged, so the weekly numbers can
   show whether the days he breathes are the days his HRV is better. */
let BR={total:600,left:600,timer:null,running:false,phase:'',t0:0,spent:0,logged:false};
function breathLog(){return (DB.get('breath_log')||[]).filter(x=>x&&x.date);}
function breathToday(){return breathLog().filter(x=>x.date===TODAY).length;}
function breathSound(){return DB.get('breath_sound')!==false;}
function openBreath(){
  breathStop();
  BR.total=(DB.get('breath_min')||10)*60;BR.left=BR.total;BR.spent=0;BR.logged=false;BR.phase='';
  el('breath').classList.add('on');
  breathDraw();
}
function breathDraw(){
  el('br-clock').textContent=fmt(BR.left);
  el('br-main').textContent=BR.running?'Pause':(BR.spent?'Resume':'Start');
  el('br-min').textContent=(BR.total/60)+' min';
  el('br-snd').textContent=breathSound()?'Sound on':'Sound off';
  el('br-step').textContent='Breathing · '+breathToday()+' of 2 today';
  if(!BR.running){el('br-lab').textContent=BR.left<=0?'Done':'4 in · 6 out';
    const dot=el('br-dot');dot.style.transition='transform .4s ease';dot.style.transform='scale(.55)';}
}
function breathPhase(p){
  if(p===BR.phase)return;
  BR.phase=p;
  const dot=el('br-dot');
  dot.style.transition='transform '+(p==='in'?4:6)+'s linear';
  dot.style.transform=p==='in'?'scale(1)':'scale(.55)';
  el('br-lab').textContent=p==='in'?'In':'Out';
  if(breathSound()){const c=getCtx();if(c&&c.state==='running')tone(c,p==='in'?392:294,c.currentTime,.35,.06);}
}
function breathToggle(){
  if(BR.running){breathStop();breathDraw();return;}
  if(BR.left<=0){BR.left=BR.total;BR.spent=0;BR.logged=false;}
  BR.running=true;keepAwake(true);startKeepAlive();getCtx();
  const end=Date.now()+BR.left*1000,from=Date.now(),had=BR.spent;
  BR.phase='';
  el('br-main').textContent='Pause';
  BR.timer=setInterval(()=>{
    const now=Date.now();
    BR.left=Math.max(0,Math.ceil((end-now)/1000));
    BR.spent=had+(now-from)/1000;
    breathPhase(((now-from)/1000)%10<4?'in':'out');
    el('br-clock').textContent=fmt(BR.left);
    if(now>=end){breathStop();breathSave();beepNow();breathDraw();}
  },100);
}
function breathStop(){clearInterval(BR.timer);BR.timer=null;if(BR.running){keepAwake(false);stopKeepAlive();}BR.running=false;BR.phase='';}
/* Two minutes or more counts as a session; less was a false start. */
function breathSave(){
  if(BR.logged||BR.spent<120)return;
  const l=breathLog();
  l.push({date:TODAY,min:Math.max(1,Math.round(BR.spent/60)),ts:Date.now()});
  DB.set('breath_log',l.slice(-400));
  BR.logged=true;
}
function breathClose(){
  breathStop();breathSave();
  el('breath').classList.remove('on');
  renderFoot();
}
function breathMin(){
  if(BR.running)return;
  const n=BR.total===600?5:10;
  DB.set('breath_min',n);BR.total=n*60;BR.left=BR.total;BR.spent=0;BR.logged=false;breathDraw();
}
function breathSnd(){DB.set('breath_sound',!breathSound());breathDraw();}

/* ═══ 20. PROGRESS ═══
   One question: which way am I going. Six tiles answer it at a glance,
   each against the same four weeks; a tap opens the chart. Then the two
   things he trains: runs and strength. */
let progRange=90,progOpen=null,strAll=false;
function setRange(n){progRange=n;renderProgress();}
function rangeBar(){
  return '<div class="tabs" style="margin:0 16px 12px">'+
    [[30,'30 days'],[90,'3 months'],[120,'All']].map(([n,l])=>
      '<button class="'+(progRange===n?'on':'')+'" onclick="setRange('+n+')">'+l+'</button>').join('')+'</div>';
}
/* A single morning against a single morning four weeks ago is noise.
   Compare the 7-day mean with the 7-day mean that ended back then. */
function trend28(name,ser){
  const S2=ser||metricSeries(name,150);
  if(S2.length<10)return null;
  const now=mean(winVals(S2,TODAY,7));
  const then=mean(winVals(S2,addDays(TODAY,-28),7));
  if(!now||!then)return null;
  return +(now-then).toFixed(2);
}
const EM_D='—';
function tile(o){
  const open=progOpen===o.key;
  let col='var(--t3)',arrow='';
  const has=o.d!==null&&o.d!==undefined;
  if(has){
    arrow='→';col='var(--t2)';
    if(Math.abs(o.d)>=o.thr){
      const good=o.better==='down'?o.d<0:o.d>0;
      col=good?'var(--green)':'var(--red)';
      arrow=o.d>0?'↑':'↓';
    }
  }
  const dt=!has?'':' '+(o.d>0?'+':'')+(o.fmt?o.fmt(o.d):o.d.toFixed(o.dec));
  return '<div onclick="toggleMetric(\''+o.key+'\')" style="cursor:pointer;background:var(--bg2);border:1px solid '+
    (open?'var(--line2)':'var(--line)')+';border-radius:12px;padding:12px 13px">'+
    '<div class="muted" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase">'+o.label+'</div>'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:5px">'+
      '<span style="font-family:\'Instrument Serif\',serif;font-size:23px">'+(o.val||EM_D)+
      (o.unit?'<span style="font-size:11px;color:var(--t3)"> '+o.unit+'</span>':'')+'</span>'+
      '<span style="color:'+col+';font-size:12px">'+arrow+dt+'</span>'+
    '</div><div class="muted" style="font-size:10px;margin-top:3px'+(o.warn?';color:var(--yellow)':'')+'">'+(o.sub||'vs 4 weeks ago')+'</div></div>';
}
function toggleMetric(k){progOpen=progOpen===k?null:k;renderProgress();}
function metricCard(name,cur,unit,data,better,dec,noteText){
  if(!data.length)return '<div class="metric"><div class="m-name">'+name+'</div><div class="muted" style="margin-top:6px">No data yet</div></div>';
  const first=data[0],diff=cur-first;
  const good=better==='down'?diff<0:diff>0;
  const col=Math.abs(diff)<(dec?0.3:0.5)?'#9A9AA5':good?'#4ADE80':'#F87171';
  const id='c-'+name.replace(/\W/g,'');
  const mn=Math.min(...data),mx=Math.max(...data);
  const half=Math.floor(data.length/2);
  const trend=mean(data.slice(half))-mean(data.slice(0,half));
  setTimeout(()=>{const c=el(id);if(c)c.dataset.h=72;sparkline(id,data,col);},0);
  return '<div class="metric"><div class="m-top">'+
    '<div><div class="m-name">'+name+'</div><div class="m-val">'+cur.toFixed(dec||0)+'<span class="hero-unit">'+unit+'</span></div></div>'+
    '<div><div class="m-delta" style="color:'+col+'">'+(diff>0?'+':'')+diff.toFixed(dec||1)+'</div>'+
    '<div class="m-since">over '+data.length+' readings</div></div></div>'+
    '<canvas id="'+id+'" style="height:72px;margin-top:10px"></canvas>'+
    '<div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">'+
      '<span class="muted">low '+mn.toFixed(dec||0)+'</span>'+
      '<span class="muted">high '+mx.toFixed(dec||0)+'</span>'+
      '<span class="muted">2nd half '+(trend>0?'+':'')+trend.toFixed(1)+'</span></div>'+
    (noteText?'<div class="muted" style="margin-top:8px;line-height:1.6">'+noteText+'</div>':'')+
    '</div>';
}
function runRow(r){
  const f=runFlags(r);
  const main=r.cont?r.cont+' min'+(r.sKmh?' · '+r.sKmh.toFixed(1)+' km/h'+(r.sHr?' · '+r.sHr+' bpm':''):'')

    '<div class="muted" style="margin-top:3px">'+r.km.toFixed(2)+' km in '+Math.round(r.min)+' min'+

function runsCard(){
  const all=runList();
  if(!all.length)return '<div class="card"><div class="muted" style="line-height:1.6">No runs yet. They arrive with the weekly file import — the daily paste does not carry workouts.</div></div>';

      '<div class="muted" style="margin:8px 0 6px;line-height:1.6">Bar: minutes run without a break. Under it: heart rate in minutes 6–15. Grey: hilly route or low-HRV morning, so not comparable.</div>':'')+
    all.slice(-8).reverse().map(runRow).join('')+

function drawRuns(id,det){
  const c=el(id);if(!c||!c.parentElement)return;
  const w=c.parentElement.offsetWidth-28;if(!w||w<20){setTimeout(()=>drawRuns(id,det),300);return;}
  const dpr=window.devicePixelRatio||1,hh=150;
  c.style.width=w+'px';c.width=w*dpr;c.height=hh*dpr;
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,hh);
  const T=18,B=34,H=hh-T-B,n=det.length;
  const max=Math.max(20,...det.map(r=>r.cont));
  const slot=w/n,bw=Math.min(46,slot-10);
  x.font='11px "DM Mono",monospace';x.textAlign='center';
  det.forEach((r,i)=>{
    const cx=slot*i+slot/2,bh=Math.max(3,Math.round(r.cont/max*H));
    const clean=!runFlags(r).length;
    x.fillStyle=clean?'#7DA6F0':'#33333A';x.globalAlpha=clean?.85:1;
    x.fillRect(cx-bw/2,T+H-bh,bw,bh);x.globalAlpha=1;
    x.fillStyle=clean?'#EDEDF0':'#9A9AA5';x.fillText(r.cont+' min',cx,T+H-bh-5);
    x.fillStyle=clean?'#9A9AA5':'#5E5E68';x.fillText(r.sHr?r.sHr+' bpm':EM_D,cx,hh-19);
    x.fillStyle='#5E5E68';x.fillText((+r.date.slice(8))+' '+MON[+r.date.slice(5,7)-1],cx,hh-5);
  });
}
function toggleStr(){strAll=!strAll;renderProgress();}
function renderProgress(){
  const b=el('p-body'),R=progRange;
  const w=(DB.get('weight_log')||[]),lw=w.length?w[w.length-1]:null;
  const wAge=lw?daysBetween(lw.date,TODAY):null;
  const wThen=lw?w.filter(r=>r.date<=addDays(lw.date,-21)).pop():null;
  const wFresh=lw&&wAge<=14;
  const st=stepsAvg();
  const sl=sleepRecords();
  const M={
    hrv:{label:'HRV',cur:S.hrv7,unit:'ms',d:trend28('heart_rate_variability'),better:'up',dec:1,thr:0.5,
      data:vals('heart_rate_variability',R),
      note:S.hrvBand?'Your normal band is '+S.hrvBand[0].toFixed(0)+'–'+S.hrvBand[1].toFixed(0)+' ms over the last 60 days. Inside it is the good signal, not a number that has to keep rising.':''},
    rhr:{label:'Resting HR',cur:mean(S.rhrV.slice(-7)),unit:'bpm',d:trend28('resting_heart_rate'),better:'down',dec:0,thr:0.5,
      data:vals('resting_heart_rate',R)},
    vo2:{label:'VO2max',cur:S.vo2,unit:'',d:trend28('vo2_max'),better:'up',dec:1,thr:0.3,

    sleep:{label:'Sleep',cur:mean(sl.slice(-7).map(x=>x.totalSleep||0)),unit:'h',d:trend28('',sleepSeries()),better:'up',dec:1,thr:0.3,

      data:vals('step_count',R),fmt:v=>(v<0?'-':'')+fmtK(Math.abs(v)),
      note:'Daily volume is the lever your own data points at: more steps one day, better HRV the next morning.'}
  };
  const t=k=>tile({key:k,label:M[k].label,val:M[k].cur?(k==='steps'?fmtK(M[k].cur):M[k].cur.toFixed(M[k].dec)):'',
    unit:M[k].unit,d:M[k].d,better:M[k].better,dec:M[k].dec,thr:M[k].thr,fmt:M[k].fmt||null});
  const wTile=tile({key:'weight',label:'Weight',val:lw?lw.kg.toFixed(1):'',unit:'kg',
    d:wFresh&&wThen?+(lw.kg-wThen.kg).toFixed(1):null,better:'down',dec:1,thr:0.3,

/* ═══ MONTHS ═══
   The app keeps 120 days of readings, so the road from February was
   only in the notes. A monthly average costs a few bytes and stays. The
   months before the stored data are seeded from his own earlier
   analyses and marked with a tilde. */
const MONTH_SEED={
  '2026-02':{rhr:{m:75,n:0}},
  '2026-04':{hrv:{m:36.1,n:0},rhr:{m:62.6,n:0},resp:{m:13.3,n:0},vo2:{m:38.3,n:0},steps:{m:10000,n:0}},
  '2026-06':{hrv:{m:30.7,n:0},rhr:{m:66.1,n:0},resp:{m:14.2,n:0}}
};
const MONTH_METRICS=[['hrv','heart_rate_variability'],['rhr','resting_heart_rate'],['resp','respiratory_rate'],
  ['steps','step_count'],['vo2','vo2_max']];
function rollMonths(){
  const m=HM(),out=DB.get('monthly')||JSON.parse(JSON.stringify(MONTH_SEED));
  const part=partialDay(),by={};
  const add=(d,key,v)=>{if(!d||!(v>0))return;const mo=d.slice(0,7);((by[mo]=by[mo]||{})[key]=by[mo][key]||[]).push(v);};
  MONTH_METRICS.forEach(([key,name])=>(m[name]||[]).forEach(r=>{
    const d=String(r.date||'').slice(0,10);
    if(RUNNING.indexOf(name)>=0&&d===part)return;
    add(d,key,r.qty);}));
  (m.sleep_analysis||[]).forEach(r=>add(String(r.date||'').slice(0,10),'sleep',r.totalSleep));
  Object.keys(by).forEach(mo=>Object.keys(by[mo]).forEach(k=>{
    const v=by[mo][k],o=out[mo]=out[mo]||{};
    // a month only gets better as more of its days arrive; it never thins out
    if(!o[k]||v.length>=o[k].n)o[k]={m:+mean(v).toFixed(2),n:v.length};
  }));
  DB.set('monthly',out);
}
function monthsCard(){
  const mo=DB.get('monthly')||{};

  const keys=Object.keys(mo).sort().filter(k=>Object.keys(mo[k]).some(x=>mo[k][x].n===0||mo[k][x].n>=14));
  if(keys.length<2)return '';

    const v=k?(Math.round(o.m/100)/10).toFixed(1)+'k':o.m.toFixed(dec);

  };

    ['Month','HRV','RHR','VO2','Steps','Weight'].map((x,i)=>'<span class="muted" style="flex:'+(i?1:1.15)+';text-align:'+(i?'right':'left')+'">'+x+'</span>').join('')+'</div>';
  const rows=keys.map(k=>{

      '<span style="flex:1.15;white-space:nowrap">'+MON[+k.slice(5)-1]+(k.slice(0,4)===TODAY.slice(0,4)?'':' ’'+k.slice(2,4))+'</span>'+

/* ═══ 21. HISTORY ═══ */
/* How fast the weight is actually coming off, over several windows. A
   window only gets a row when there is a weigh-in inside it: "97.6 to
   97.6, 0 per week" six weeks after the last reading was a blank dressed
   up as a result. */
function weightTrends(){
  const w=(DB.get('weight_log')||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(w.length<2)return null;
  const now=w[w.length-1];
  const at=days=>{const cut=addDays(TODAY,-days);
    if(now.date<=cut)return null;
    const p=w.filter(r=>r.date<=cut);return p.length?p[p.length-1]:null;};
  const rows=[[7,'7 days'],[30,'30 days'],[90,'90 days']].map(function(x){
    const p=at(x[0]); if(!p)return null;
    const span=daysBetween(p.date,now.date)||1;
    const diff=now.kg-p.kg;
    return {label:x[1],from:p.kg,diff:+diff.toFixed(1),perWeek:+(diff/span*7).toFixed(2)};
  }).filter(Boolean);
  const first=w[0], spanAll=daysBetween(first.date,now.date)||1;
  return {now:now.kg,date:now.date,age:daysBetween(now.date,TODAY),rows,n:w.length,all:{from:first.kg,date:first.date,
    diff:+(now.kg-first.kg).toFixed(1),perWeek:+((now.kg-first.kg)/spanAll*7).toFixed(2)}};
}
function weightCard(){
  const t=weightTrends();
  if(!t)return '<div class="card"><div class="muted">Log your weight a few times and the rate appears here.</div></div>';
  const col=function(d){return d<-0.1?'var(--green)':d>0.1?'var(--red)':'var(--t2)';};
  return '<div class="card">'+
    '<div class="row" style="align-items:flex-end;margin-bottom:12px">'+
      '<div><div style="font-family:\'Instrument Serif\',serif;font-size:32px">'+t.now.toFixed(1)+
      '<span style="font-size:12px;color:var(--t3)"> kg</span></div>'+
      '<div class="muted" style="margin-top:2px'+(t.age>14?';color:var(--yellow)':'')+'">'+
        (t.age>14?'last weighed '+shortDate(t.date)+' · '+t.age+' days ago':t.n+' readings since '+shortDate(t.all.date))+'</div></div>'+
      '<div style="text-align:right"><div style="color:'+col(t.all.perWeek)+';font-size:13px">'+
      (t.all.diff>0?'+':'')+t.all.diff+' kg since '+shortDate(t.all.date)+'</div><div class="muted">'+
      (t.all.perWeek>0?'+':'')+t.all.perWeek+' kg / week</div></div></div>'+
    t.rows.map(function(r){return '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">'+
      '<span class="muted">last '+r.label+'</span>'+
      '<span style="font-size:12px">'+r.from.toFixed(1)+' → '+t.now.toFixed(1)+
      ' <span style="color:'+col(r.perWeek)+'">'+(r.diff>0?'+':'')+r.diff+'</span>'+
      ' <span class="muted">'+(r.perWeek>0?'+':'')+r.perWeek+'/wk</span></span></div>';}).join('')+
    '<div class="muted" style="margin-top:9px;line-height:1.6">Half a kilo a week is the sustainable rate — faster costs muscle.</div>'+
    '</div>';
}
/* Only exercises you have actually loaded, newest first. */
function weightsTable(limit){

    const done=sets.filter(y=>y.done&&y.kg>0).map(y=>y.kg);

/* ═══ HISTORY AS WEEKS ═══
   Twenty-five identical cards told him nothing. The week is the unit he
   can actually steer: it is where the imbalance shows up. */
let histOpen=null;
function toggleWeek(k){histOpen=histOpen===k?null:k;renderHistory();}
function weekRows(n){
  const ex=Object.fromEntries(metricSeries('apple_exercise_time',200));
  const st=Object.fromEntries(metricSeries('step_count',200));
  const hv=Object.fromEntries(metricSeries('heart_rate_variability',200));
  const sess=sessions(), aero=aeroLog();
  const rows=[];
  for(let w=0;w<n;w++){
    const a=addDays(weekStart(),-7*w), b=addDays(a,6);
    const inW=d=>d>=a&&d<=b&&d<=TODAY;
    const ss=sess.filter(x=>inW(x.date)&&!x.skipped&&STR_TYPES.includes(x.type));
    const aa=aero.filter(x=>inW(x.date));
    const ds=Object.keys(ex).filter(inW);
    const hs=Object.keys(hv).filter(inW).map(k=>hv[k]);
    const sp=Object.keys(st).filter(inW).map(k=>st[k]);
    if(!ss.length&&!aa.length&&!hs.length)continue;
    rows.push({key:a,a,b,str:ss.length,aer:aa.length,
      hrv:hs.length?mean(hs):0, steps:sp.length?mean(sp):0,
      min:ds.length?ds.reduce((x,k)=>x+ex[k],0):0,
      sessions:ss, aeros:aa, current:w===0});
  }
  return rows;
}
/* ═══ THIS WEEK AGAINST THE LAST FOUR ═══
   What he did, not what the watch measured: the measured side is on
   Progress. A week still running is compared on what it has so far. */
function weekStats(off){
  const a=addDays(weekStart(),-7*off),b=addDays(a,6);
  const inW=d=>d>=a&&d<=b&&d<=TODAY;
  const st=metricSeries('step_count',45).filter(e=>inW(e[0])).map(e=>e[1]);
  const runs=runList().filter(r=>inW(r.date));
  return {
    str:realSessions().filter(x=>inW(x.date)).length,
    runs:runs.length,
    runMin:Math.round(runs.reduce((s,r)=>s+(r.min||0),0)),
    steps:st.length?Math.round(mean(st)):0,
    breath:breathLog().filter(x=>inW(x.date)).length
  };
}
function weekCompare(){
  const cur=weekStats(0),prev=[1,2,3,4].map(weekStats);
  const avg=k=>mean(prev.map(p=>p[k]).filter(v=>v>0||k!=='steps'));
  const av=k=>prev.reduce((s,p)=>s+p[k],0)/prev.length;
  const day=((new Date(TODAY).getDay()+6)%7)+1;
  const rows=[
    ['Strength sessions',cur.str,av('str'),1,0.5],
    ['Runs',cur.runs,av('runs'),1,0.5],
    ['Run minutes',cur.runMin,av('runMin'),0,8],
    ['Steps a day',cur.steps,avg('steps'),0,500],
    ['Breathing sessions',cur.breath,av('breath'),1,1.5]
  ];
  const fm=(v,dec,k)=>k?fmtK(v):(dec&&v%1?v.toFixed(1):String(Math.round(v)));
  const body=rows.map(([l,c,a,dec,thr])=>{
    const steps=l==='Steps a day';
    const col=c-a>=thr?'var(--green)':a-c>=thr?'var(--yellow)':'var(--t1)';
    return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)">'+
      '<span class="muted" style="flex:1.6;color:var(--t2)">'+l+'</span>'+
      '<span style="flex:1;text-align:right;font-size:13px;color:'+col+'">'+(steps&&!c?'–':fm(c,0,steps))+'</span>'+
      '<span class="muted" style="flex:1;text-align:right">'+(steps&&!a?'–':fm(a,dec,steps))+'</span></div>';
  }).join('');
  return '<div class="card" style="padding-bottom:8px">'+
    '<div class="row" style="padding-bottom:8px"><span class="muted" style="flex:1.6">Day '+day+' of 7</span>'+
    '<span class="muted" style="flex:1;text-align:right">this week</span><span class="muted" style="flex:1;text-align:right">avg of 4</span></div>'+
    body+'</div>';
}

function renderHistory(){
  const sess=sessions(),aero=aeroLog();
  const byDate={};
  sess.forEach(x=>{byDate[x.date]=x.skipped?'r':(x.type==='rest'?'r':'s');});
  aero.forEach(a=>{if(byDate[a.date]!=='s')byDate[a.date]='a';});
  // 8 weeks, each row labelled with the Monday it starts on
  const end=new Date(TODAY);end.setDate(end.getDate()+(6-((end.getDay()+6)%7)));
  let grid='<em></em>'+WD.map(x=>'<em>'+x+'</em>').join('');
  for(let wk=7;wk>=0;wk--){
    const mon=new Date(end);mon.setDate(mon.getDate()-(wk*7+6));
    grid+='<u>'+(+iso(mon).slice(8))+' '+MON[mon.getMonth()]+'</u>';
    for(let dd=0;dd<7;dd++){
      const d=new Date(mon);d.setDate(d.getDate()+dd);const k=iso(d);
      grid+='<i class="'+(k>TODAY?'':(byDate[k]||''))+(k===TODAY?' t':'')+'"></i>';
    }
  }
  const rows=weekRows(12).map(r=>{
    const open=histOpen===r.key;

      }).join(''):'<div class="muted">No strength session this week</div>')+
      r.aeros.map(x=>'<div class="row" style="padding:3px 0"><span class="muted" style="color:var(--blue)">'+
        h(modeName(x.mode))+(x.auto?' \u00B7 watch':'')+'</span><span class="muted">'+x.date.slice(5)+
        (x.km?' \u00B7 '+x.km+' km':'')+' \u00B7 '+x.minutes+' min'+(x.avg?' \u00B7 '+x.avg+' bpm':'')+'</span></div>').join('')+
      '</div>';
    return '<div class="hcard" onclick="toggleWeek(\''+r.key+'\')" style="cursor:pointer'+
      (open?';border-color:var(--line2)':'')+'">'+
      '<div class="row"><div style="font-size:12px">'+label+
        (r.current?' <span class="muted" style="font-size:10px">this week</span>':'')+'</div>'+
      '<div class="muted" style="font-size:11px">'+(open?'\u2212':'+')+'</div></div>'+
      '<div class="muted" style="margin-top:5px">'+
        '<span style="color:'+strCol+'">'+r.str+' strength</span> \u00B7 '+
        '<span style="color:var(--blue)">'+r.aer+' aerobic</span>'+
        (r.hrv?' \u00B7 HRV '+r.hrv.toFixed(0)+' avg':'')+
        (r.steps?' \u00B7 '+Math.round(r.steps/100)*100+' steps/day':'')+
      '</div>'+detail+'</div>';
  }).join('');
  el('h-body').innerHTML='<div class="sec" style="margin-top:4px">This week against your last four</div>'+weekCompare()+
    '<div class="card"><div class="hgrid2">'+grid+'</div>'+
    '<div class="row" style="margin-top:12px"><span class="muted">\u25A0 strength</span>'+
    '<span class="muted">\u25A0 aerobic</span><span class="muted">\u25A0 rest</span></div></div>'+
    '<div class="sec">Week by week</div>'+
    (rows||'<div class="card"><div class="muted">Nothing logged yet</div></div>');
}

/* Your watch already knows what you did. Keeping a separate manual log
   meant the app scored four hard rides and a run in October as zero. */
function workoutMode(name){
  const n=String(name||'').toLowerCase();
  if(/run|jog/.test(n))return 'jog';
  if(/cycl|bike|bicycl/.test(n))return 'bike';
  if(/row/.test(n))return 'row';
  if(/swim/.test(n))return 'swim';
  if(/hiit|interval|elliptic|cross/.test(n))return 'other';
  if(/walk|hike/.test(n))return 'walkfast';
  return 'other';
}
function ingestWorkouts(ws){
  const keep=(DB.get('health_workouts')||[]);
  const seen=new Set(keep.map(x=>x.id));
  let added=0;
  ws.forEach(w=>{
    const date=String(w.start||w.date||'').slice(0,10);
    if(!date)return;
    const min=(w.duration||0)/60;
    const hr=w.heartRate||{};
    const flat={avg:w.avgHeartRate,max:w.maxHeartRate,min:w.minHeartRate};
    const num=v=>typeof v==='number'?v:(v&&typeof v.qty==='number'?v.qty:0);
    const g=k=>num(hr[k])||num(flat[k]);
    const id=date+'|'+String(w.start||'').slice(11,16)+'|'+Math.round(min);
    const mode=workoutMode(w.name);
    const km=+toKm(w.distance&&w.distance.qty,w.distance&&w.distance.units).toFixed(2);
    const base={id,date,name:String(w.name||'Workout'),mode,
      min:+min.toFixed(1),avg:+g('avg').toFixed(0),max:+g('max').toFixed(0),km};
    if(mode==='jog'&&km>0&&min>=8){
      // runs get their own shelf, so six weeks of walks cannot push them out
      const det=runDetail(w)||{};
      upsertRun(Object.assign({id,date,t:String(w.start||'').slice(11,16),km,min:base.min,avg:base.avg,max:base.max,
        up:+num(w.elevationUp).toFixed(0),hrv:hrvOnDay(date)},det));
    }
    if(seen.has(id))return;
    keep.push(base);
    seen.add(id);added++;
  });
  keep.sort((a,b)=>a.id.localeCompare(b.id));
  DB.set('health_workouts',keep.slice(-400));
  return added;
}

/* ═══ 24. PATTERNS — correlations from your own data ═══ */
function pearson(a,b){
  const n=Math.min(a.length,b.length);if(n<8)return null;
  const x=a.slice(-n),y=b.slice(-n);
  const mx=mean(x),my=mean(y);
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){const p=x[i]-mx,q=y[i]-my;num+=p*q;dx+=p*p;dy+=q*q;}
  return (dx&&dy)?num/Math.sqrt(dx*dy):null;
}
function pairedSeries(nameA,nameB,lagB){
  const A=Object.fromEntries(metricSeries(nameA,90));
  const B=nameB==='deep'||nameB==='total'
    ? Object.fromEntries(sleepRecords().map(r=>[(r.date||'').slice(0,10),nameB==='deep'?r.deep:r.totalSleep]))
    : Object.fromEntries(metricSeries(nameB,90));
  const xs=[],ys=[];
  Object.keys(A).sort().forEach(d=>{
    const k=lagB?addDays(d,lagB):d;
    if(B[k]>0&&A[d]>0){xs.push(A[d]);ys.push(B[k]);}
  });
  return [xs,ys];
}
function buildPatterns(){
  const out=[];
  const add=(title,r,n,text)=>{if(r===null)return;out.push({title,r,n,text});};

  let [act,hrvNext]=pairedSeries('active_energy','heart_rate_variability',1);
  add('Activity today → HRV tomorrow',pearson(act,hrvNext),act.length,
    'Volume on one day and how your nervous system reads the next morning.');

  let [tot,hrvSame]=pairedSeries('heart_rate_variability','total',0);
  add('Total sleep → HRV',pearson(hrvSame,tot),tot.length,
    'Hours asleep against the same morning\u2019s reading.');

  let [hrvD,deepD]=pairedSeries('heart_rate_variability','deep',0);
  add('Deep sleep → HRV',pearson(hrvD,deepD),deepD.length,
    'Deep sleep is an outcome, not a dial you can turn.');

  const rhr=vals('resting_heart_rate',90),hv=vals('heart_rate_variability',90);
  add('Resting HR ↔ HRV',pearson(rhr,hv),Math.min(rhr.length,hv.length),
    'These normally move opposite each other. If they stop doing that, something is off in the data.');

  return out.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
}

    bloodPressure:bp.length?{readings:bp.length,latest:bp[bp.length-1].sys+'/'+bp[bp.length-1].dia}:null,
    recovery:S.ready?S.ready.total:null,

    runs:runList().filter(r=>r.date>=from).map(r=>({date:r.date,km:r.km,minutes:r.min,avgHr:r.avg,

  const t=el('mo');t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject())
    .then(()=>toast('Copied')).catch(()=>{try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select and copy manually');}});
}
function downloadMonthly(){
  const blob=new Blob([el('mo').value],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='summary-'+TODAY+'.json';a.click();toast('Downloaded');
}

/* ═══ 23. SHEET + NAV + BOOT ═══ */
function openSheet(html){el('sheet-body').innerHTML=html;el('sheet').classList.add('on');el('sheet-bg').classList.add('on');}
function closeSheet(){el('sheet').classList.remove('on');el('sheet-bg').classList.remove('on');}
function go(v){
  ['today','prog','hist'].forEach(x=>{
    el('s-'+x).classList.toggle('on',x===v);
    el('n-'+x).classList.toggle('on',x===v);
  });
  el('n-set').classList.remove('on');
  if(v==='prog')renderProgress();
  if(v==='hist')renderHistory();
  window.scrollTo(0,0);
}
function renderAll(){
  derive();
  try{logVerdict();}catch(e){}
  renderToday();
  if(el('s-prog').classList.contains('on'))renderProgress();
  if(el('s-hist').classList.contains('on'))renderHistory();
}
window.addEventListener('resize',()=>{if(el('s-prog').classList.contains('on'))renderProgress();else renderToday();});
/* One-off move to schema 3: runs get their own store, and switches left
   behind by versions long gone are swept out. Logs and measurements are
   not touched. */
function migrate(){
  try{
    const cut=addDays(TODAY,-14);
    Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>{
      const n=k.slice(P.length);
      const m=n.match(/^(sess_open_|manual_session_type_|override_rest_|draft_|am_)(\d{4}-\d\d-\d\d)$/);
      if(m&&m[2]<cut)localStorage.removeItem(k);
    });
    if((DB.get('schema')||0)<3){
    Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>{
      const n=k.slice(P.length);
      if(/^(deload_dismissed_|alert_dismissed_|adherence_|day_context_|maintenance_)/.test(n)||
         n==='last_clipboard_import'||n==='deload_anchor')localStorage.removeItem(k);
    });
    (DB.get('health_workouts')||[]).filter(w=>w.mode==='jog'&&w.km>0&&w.min>=8).forEach(w=>
      upsertRun({id:w.id,date:w.date,t:String(w.id).split('|')[1]||'',km:w.km,min:w.min,avg:w.avg,max:w.max,up:0,hrv:hrvOnDay(w.date)}));
    DB.set('schema',3);
    }
    if((DB.get('schema')||0)<4){
      DB.del('phase_hist');DB.del('phase_confirmed');
      rollMonths();
      DB.set('schema',4);
    }
  }catch(e){LASTERR='migrate: '+(e&&e.message||e);}
}
migrate();
renderAll();
/* self-contained: manifest built in memory, no extra files required */
try{
  const mf={name:'Recovery',short_name:'Recovery',start_url:'./',display:'standalone',
    background_color:'#0A0A0B',theme_color:'#0A0A0B'};
  el('mf').href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));
}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>fetch('sw.js',{method:'HEAD'})
    .then(r=>{if(r.ok)navigator.serviceWorker.register('sw.js');}).catch(()=>{}));
}
