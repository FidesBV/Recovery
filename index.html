<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0A0A0B">
<title>Recovery</title>
<link rel="manifest" id="mf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bg2:#131315; --bg3:#1C1C1F;
  --line:#232327; --line2:#33333A;
  --t1:#EDEDF0; --t2:#9A9AA5; --t3:#5E5E68;
  --green:#4ADE80; --yellow:#FBBF24; --red:#F87171; --blue:#7DA6F0;
  --gd:rgba(74,222,128,.09); --yd:rgba(251,191,36,.09); --rd:rgba(248,113,113,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'DM Mono',ui-monospace,monospace; background:var(--bg); color:var(--t1);
  font-size:13px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit;}
.wrap{max-width:520px;margin:0 auto;}
.top{padding:calc(20px + env(safe-area-inset-top)) 20px 6px;display:flex;justify-content:space-between;align-items:flex-end;}
.date{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.01em;}
h1{font-family:'Instrument Serif',serif;font-size:30px;font-weight:400;line-height:1.1;margin-top:5px;}
.sec{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin:22px 20px 9px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.card{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;}
.muted{color:var(--t3);font-size:10px;line-height:1.6;}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;}

/* hero */
.hero{margin:14px 16px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;}
.hero-val{font-family:'Instrument Serif',serif;font-size:64px;line-height:1;letter-spacing:-.03em;}
.hero-unit{font-size:11px;color:var(--t3);margin-left:4px;}
.hero-lbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
.hero-sub{font-size:11px;color:var(--t2);margin-top:8px;line-height:1.6;}
.spark{width:100%;height:34px;display:block;margin-top:14px;}

/* strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 10px;}
.strip div{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center;}
.strip b{display:block;font-family:'Instrument Serif',serif;font-size:19px;font-weight:400;line-height:1.2;}
.strip span{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);}

/* verdict */
.verdict{margin:0 16px 10px;border-radius:14px;padding:15px 16px;border:1px solid;}
.v-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.v-title{font-size:13px;}
.v-meta{font-size:9px;color:var(--t3);}
.v-why{font-size:10px;color:var(--t3);line-height:1.6;margin-bottom:11px;}
.v-plan{border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--t2);}
.v-plan div{display:flex;gap:10px;padding:3px 0;}
.v-plan u{text-decoration:none;color:var(--t3);width:78px;flex-shrink:0;font-size:10px;}

/* notices */
.note{margin:0 16px 10px;border-radius:12px;padding:12px 15px;font-size:11px;line-height:1.6;border:1px solid;}
.note b{display:block;font-weight:400;margin-bottom:3px;}

/* exercise */
.ex{border-bottom:1px solid var(--line);padding:13px 0;}
.ex:last-child{border-bottom:none;}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.ex-name{font-size:14px;}
.ex-target{font-size:10px;color:var(--t3);white-space:nowrap;}
.ex-note{font-size:10px;color:var(--t3);margin-top:4px;line-height:1.5;}
.ex-hint{font-size:10px;color:var(--green);margin-top:5px;}
.sets{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.set{flex:1;min-width:52px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--t2);cursor:pointer;transition:.15s;}
.set.done{background:var(--gd);border-color:rgba(74,222,128,.3);color:var(--green);}

/* buttons */
.btn{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:15px;border-radius:12px;border:1px solid var(--line2);background:var(--bg3);color:var(--t1);font-size:12px;letter-spacing:.05em;cursor:pointer;text-align:center;}
.btn-go{background:var(--gd);border-color:rgba(74,222,128,.35);color:var(--green);}
.btn-quiet{background:transparent;color:var(--t3);font-size:11px;padding:12px;}
.btn:active{transform:scale(.99);}

/* modes */
.modes{display:flex;gap:6px;margin-bottom:13px;}
.modes button{flex:1;padding:9px 4px;border-radius:8px;font-size:10px;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--t2);}
.modes button.on{background:var(--bg3);border-color:var(--line2);color:var(--t1);}
.modes button:disabled{opacity:.4;}

/* timer */
.clock{font-family:'Instrument Serif',serif;font-size:44px;text-align:center;letter-spacing:.02em;margin:6px 0 2px;}

/* progress */
.metric{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;}
.m-name{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.m-val{font-family:'Instrument Serif',serif;font-size:28px;line-height:1.1;margin-top:3px;}
.m-delta{font-size:11px;text-align:right;}
.m-since{font-size:9px;color:var(--t3);}
canvas{width:100%;display:block;}
.tabs{display:flex;gap:6px;margin:0 16px 12px;}
.tabs button{flex:1;padding:9px;border-radius:9px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--t3);cursor:pointer;}
.tabs button.on{background:var(--bg3);border-color:var(--line2);color:var(--t1);}

/* settings rows */
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.srow:last-child{border-bottom:none;}
.s-l{font-size:12px;}
.s-s{font-size:10px;color:var(--t3);margin-top:3px;line-height:1.5;}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex-shrink:0;cursor:pointer;transition:.2s;}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--t1);transition:.2s;}
.sw.on{background:var(--green);}
.sw.on::after{transform:translateX(18px);}
.step{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.step div{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);background:var(--bg3);}
.step b{font-family:'Instrument Serif',serif;font-size:17px;font-weight:400;min-width:14px;text-align:center;}
input[type=number],input[type=text]{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--t1);outline:none;width:100%;text-align:center;}
input:focus{border-color:var(--line2);}
.inline{display:flex;gap:8px;}
.inline button{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:0 18px;color:var(--t1);cursor:pointer;font-size:11px;}

/* history */
.hcard{margin:0 16px 8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hgrid i{aspect-ratio:1;border-radius:3px;background:var(--bg3);}
.hgrid i.s{background:var(--green);opacity:.75;}
.hgrid i.a{background:var(--blue);opacity:.75;}
.hgrid i.r{background:var(--line2);}
.hgrid i.t{outline:1px solid var(--t2);outline-offset:1px;}

/* nav + sheet */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,11,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;}
nav button{flex:1;background:none;border:none;padding:13px 0 14px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);cursor:pointer;}
nav button.on{color:var(--t1);}
nav b{display:block;font-size:15px;margin-bottom:3px;font-weight:400;}
#guide{position:fixed;inset:0;background:var(--bg);z-index:180;display:none;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));}
#guide.on{display:flex;}
.g-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px;}
.g-step{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);}
.g-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.g-bar div{height:100%;background:var(--green);width:0;transition:width .3s;}
.g-mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;}
.g-phase{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);}
.g-phase.rest{color:var(--yellow);}
.g-name{font-family:'Instrument Serif',serif;font-size:34px;line-height:1.15;margin:10px 0 8px;}
.g-note{font-size:13px;color:var(--t2);line-height:1.6;max-width:330px;margin:0 auto;}
.g-target{font-size:15px;color:var(--t1);margin-top:14px;}
.g-adj{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.g-field{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:136px;}
.g-field .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;}
.g-field .c{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.g-field button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--bg3);color:var(--t2);font-size:17px;cursor:pointer;}
.g-field b{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;min-width:56px;}
.g-clock{font-family:'Instrument Serif',serif;font-size:76px;line-height:1;margin-top:14px;letter-spacing:-.02em;}
.g-btns{display:flex;flex-direction:column;gap:8px;}
.g-main{width:100%;padding:22px;border-radius:14px;border:1px solid rgba(74,222,128,.35);background:var(--gd);
  color:var(--green);font-size:15px;letter-spacing:.05em;cursor:pointer;}
.g-sub{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--t3);font-size:12px;cursor:pointer;}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;transition:.25s;}
#sheet-bg.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);z-index:160;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;max-width:520px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom));}
#sheet.on{transform:translateY(0);}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 4px;}
.screen{display:none;}
.screen.on{display:block;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--line2);color:var(--t1);padding:11px 20px;border-radius:24px;font-size:11px;z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="screen on" id="s-today"><div class="wrap">
  <div class="top"><div><div class="date" id="t-date">—</div><h1 id="t-hello">Today</h1></div>
    <div style="text-align:right"><div class="date" id="t-phase">—</div><div class="muted" id="t-streak" style="margin-top:4px">—</div></div>
  </div>
  <div id="t-hero"></div>
  <div id="t-strip"></div>
  <div id="t-wellness"></div>
  <div id="t-verdict"></div>
  <div id="t-notices"></div>
  <div id="t-work"></div>
  <div class="sec">Measurements</div>
  <div id="t-log"></div>
</div></div>

<div class="screen" id="s-prog"><div class="wrap">
  <div class="top"><div><div class="date">Progress</div><h1>Direction</h1></div></div>
  <div class="tabs">
    <button class="on" id="pt-health" onclick="setProgTab('health')">Health</button>
    <button id="pt-body" onclick="setProgTab('body')">Body &amp; strength</button>
  </div>
  <div id="p-body"></div>
</div></div>

<div class="screen" id="s-hist"><div class="wrap">
  <div class="top"><div><div class="date">History</div><h1>What you did</h1></div></div>
  <div id="h-body"></div>
</div></div>

<nav>
  <button class="on" id="n-today" onclick="go('today')"><b>◎</b>Today</button>
  <button id="n-prog" onclick="go('prog')"><b>◠</b>Progress</button>
  <button id="n-hist" onclick="go('hist')"><b>≡</b>History</button>
  <button id="n-set" onclick="openSettings()"><b>⚙</b>Settings</button>
</nav>

<div id="guide">
  <div class="g-top">
    <div class="g-step" id="g-step">—</div>
    <button class="x" onclick="guideExit()">✕</button>
  </div>
  <div class="g-bar"><div id="g-fill"></div></div>
  <div class="g-mid">
    <div class="g-phase" id="g-phase">—</div>
    <div class="g-name" id="g-name">—</div>
    <div class="g-note" id="g-note"></div>
    <div class="g-target" id="g-target"></div>
    <div class="g-clock" id="g-clock"></div>
  </div>
  <div class="g-btns">
    <button class="g-main" id="g-main" onclick="guideMain()">Start</button>
    <div style="display:flex;gap:8px">
      <button class="g-sub" onclick="guidePrev()">← Back</button>
      <button class="g-sub" onclick="guideNext(true)">Skip →</button>
    </div>
  </div>
</div>

<div id="sheet-bg" onclick="closeSheet()"></div>
<div id="sheet"><div class="grip"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ═══ 1. STORAGE ═══ */
const P='rv2_';
const DB={
  get(k,d){try{const v=localStorage.getItem(P+k);return v===null?(d===undefined?null:d):JSON.parse(v);}catch(e){return d===undefined?null:d;}},
  set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true;}catch(e){toast('Storage full');return false;}},
  del(k){try{localStorage.removeItem(P+k);}catch(e){}}
};
if(!DB.get('schema'))DB.set('schema',2);

/* ═══ 2. DATE ═══ */
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function today(){return iso(new Date());}
let TODAY=today();
function dateGuard(){const n=today();if(n!==TODAY){TODAY=n;renderAll();}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dateGuard();});
window.addEventListener('focus',dateGuard);
setInterval(dateGuard,60000);
function addDays(k,n){const d=new Date(k);d.setDate(d.getDate()+n);return iso(d);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

/* ═══ 3. HEALTH DATA ═══ */
function metricSeries(name,days){
  const m=DB.get('health_metrics');
  if(!m||!m[name])return [];
  const cut=addDays(TODAY,-days);
  return m[name].map(r=>[(r.date||'').slice(0,10),r.qty||0])
    .filter(e=>e[0]&&e[0]>=cut&&e[1]>0).sort((a,b)=>a[0].localeCompare(b[0]));
}
function vals(name,days){return metricSeries(name,days).map(e=>e[1]);}
function mean(a){const v=(a||[]).filter(x=>x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0;}
function last(a){return a&&a.length?a[a.length-1]:0;}
function median(a){const v=[...a].sort((x,y)=>x-y);return v.length?v[Math.floor(v.length/2)]:0;}
function sleepRecords(){const m=DB.get('health_metrics');return (m&&m.sleep_analysis)||[];}

/* ═══ 4. TRAINING HISTORY ═══ */
function sessions(){return (DB.get('session_log')||[]).filter(s=>s&&s.date);}
function realSessions(){return sessions().filter(s=>!s.skipped&&['push','pull','legs'].includes(s.type));}
function doneToday(){return sessions().some(s=>s.date===TODAY&&!s.skipped);}
function consecutiveTraining(){
  const done=new Set(realSessions().map(s=>s.date));
  let n=0,k=addDays(TODAY,-1);
  for(let i=0;i<7;i++){if(done.has(k)){n++;k=addDays(k,-1);}else break;}
  return n;
}
function trainingStreak(){
  const done=new Set(sessions().filter(s=>!s.skipped).map(s=>s.date));
  let n=0,k=done.has(TODAY)?TODAY:addDays(TODAY,-1);
  for(let i=0;i<400;i++){if(done.has(k)){n++;k=addDays(k,-1);}else break;}
  return n;
}

/* ═══ 5. PHASE — ratchet, not a switch ═══ */
function rawPhase(hrvV){const a=mean(hrvV.slice(-7));return !a?1:a>=42?3:a>=36?2:1;}
function confirmPhase(hrvV){
  const raw=rawPhase(hrvV);
  let hist=(DB.get('phase_hist')||[]).filter(e=>e.date!==TODAY);
  hist.push({date:TODAY,raw});hist=hist.slice(-21);DB.set('phase_hist',hist);
  let conf=DB.get('phase_confirmed');
  if(!conf){conf=raw;DB.set('phase_confirmed',conf);return conf;}
  const r=hist.slice(-14);
  if(r.length>=10){
    if(r.filter(e=>e.raw>=conf+1).length>=10&&conf<3){conf++;DB.set('phase_confirmed',conf);}
    else if(r.length>=14&&r.every(e=>e.raw<conf)&&conf>1){conf--;DB.set('phase_confirmed',conf);}
  }
  return conf;
}
const PHASE_NAME={1:'Phase 1 · Recovery',2:'Phase 2 · Building',3:'Phase 3 · Growth'};

/* ═══ 6. CORE LEVEL — independent of HRV ═══ */
const CORE_LEVELS={
  1:{sets:3,secs:25,reps:10,steps:30,label:'Foundation'},
  2:{sets:3,secs:35,reps:12,steps:40,label:'Building'},
  3:{sets:3,secs:45,reps:14,steps:50,label:'Solid'},
  4:{sets:4,secs:55,reps:16,steps:60,label:'Strong'},
  5:{sets:4,secs:70,reps:18,steps:70,label:'Advanced'}
};
function coreLevel(){
  const m=DB.get('core_level_manual');
  if(m&&m>=1&&m<=5)return m;
  const base=DB.get('core_level_base')||0;
  return Math.min(5,Math.max(1,Math.floor((realSessions().length-base)/14)+1));
}

/* ═══ 7. DELOAD ═══ */
function deloadWeek(){
  let a=DB.get('deload_anchor');
  if(!a){const f=sessions().map(s=>s.date).sort()[0];if(!f)return false;a=f;DB.set('deload_anchor',a);}
  return (Math.floor(daysBetween(a,TODAY)/7)%5)+1===5;
}

/* ═══ 8. DERIVED STATE ═══ */
let S={};
function derive(){
  const hrvS=metricSeries('heart_rate_variability',60);
  const hrvV=hrvS.map(e=>e[1]);
  const todayHrv=hrvS.filter(e=>e[0]===TODAY).map(e=>e[1])[0];
  const rhrV=vals('resting_heart_rate',60);
  const sl=sleepRecords();
  const slToday=sl.filter(r=>(r.date||'').slice(0,10)===TODAY)[0]||{};
  const respV=vals('respiratory_rate',14);
  const vo2V=vals('vo2_max',90);
  const tempV=vals('apple_sleeping_wrist_temperature',28);
  S={
    hrv:todayHrv||last(hrvV), hrvIsToday:!!todayHrv, hrvV,
    hrv7:mean(hrvV.slice(-7)), hrvPrev7:mean(hrvV.slice(-14,-7)),
    rhr:last(rhrV), rhrBase:mean(rhrV.slice(-14,-1)), rhrV,
    deep:slToday.deep||0, totalSleep:slToday.totalSleep||0,
    deep7:sl.slice(-7).map(r=>r.deep||0),
    resp:mean(respV.slice(-7)),
    vo2:last(vo2V), vo2First:vo2V.length?vo2V[0]:0, vo2V,
    tempDev:tempV.length>=8?+(last(tempV)-median(tempV.slice(0,-1))).toFixed(2):0,
    consec:consecutiveTraining(), phase:confirmPhase(hrvV),
    core:coreLevel(), deload:deloadWeek(), pelvic:DB.get('pelvic_pt_done')===true
  };
  S.verdict=decideDay();
  S.score=calcScore();
}

/* ═══ 9. THE DAY VERDICT — single source of truth ═══ */
const STATES={
  rest:{label:'Rest day',col:'var(--red)',bg:'var(--rd)',bd:'rgba(248,113,113,.25)'},
  softrest:{label:'Rest recommended',col:'var(--yellow)',bg:'var(--yd)',bd:'rgba(251,191,36,.25)'},
  ease:{label:'Ease off',col:'var(--yellow)',bg:'var(--yd)',bd:'rgba(251,191,36,.25)'},
  normal:{label:'Normal day',col:'var(--t1)',bg:'var(--bg2)',bd:'var(--line)'},
  room:{label:'Room to push',col:'var(--green)',bg:'var(--gd)',bd:'rgba(74,222,128,.25)'}
};
const PLANS={
  rest:{strength:'No strength session',aerobic:'Move the block to tomorrow',walk:'45–60 min, easy',steps:'8,000',cap:'110 bpm'},
  softrest:{strength:'Rest recommended — override if you feel good',aerobic:'Fine to do — low load, no strength stimulus',walk:'45–60 min',steps:'10,000',cap:'125 bpm'},
  ease:{strength:'Session minus one set',aerobic:'15 min instead of 25',walk:'45–60 min',steps:'9,000',cap:'120 bpm'},
  normal:{strength:'Session as planned',aerobic:'Full block',walk:'45–60 min',steps:'10,000',cap:'125 bpm'},
  room:{strength:'Session as planned',aerobic:'Full block — spend it here',walk:'60 min',steps:'11,000',cap:'130 bpm'}
};
function decideDay(){
  const why=[];let k='normal';
  if(!S.hrv)return {k:'normal',why:['No HRV reading yet — import health data'],plan:PLANS.normal};
  if(S.tempDev>0.5){k='rest';why.push('Wrist temp +'+S.tempDev.toFixed(2)+'\u00B0C over your own baseline');}
  else if(S.hrv<25){k='rest';why.push('HRV '+Math.round(S.hrv)+' ms — below your floor');}
  else if(S.consec>=2){k='rest';why.push(S.consec+' training days back to back');}
  else if(S.consec===1&&!DB.get('override_rest_'+TODAY)){
    return {k:'rest',soft:true,
      why:['You trained yesterday — a day between strength sessions is the plan'],
      plan:PLANS.softrest};
  }
  else{
    const drop=S.hrv7?(S.hrv7-S.hrv)/S.hrv7:0;
    const rhrUp=S.rhrBase&&S.rhr?S.rhr-S.rhrBase:0;
    const trend=S.hrv7&&S.hrvPrev7?S.hrvPrev7-S.hrv7:0;
    if(S.hrv<32){k='ease';why.push('HRV '+Math.round(S.hrv)+' ms');}
    else if(drop>0.15){k='ease';why.push('HRV '+Math.round(drop*100)+'% under your week average');}
    else if(rhrUp>=5){k='ease';why.push('Resting HR '+Math.round(rhrUp)+' bpm over baseline');}
    else if(trend>=2){k='ease';why.push('Week average HRV down '+trend.toFixed(1)+' ms');}
    else if(S.hrv>=36&&S.hrv7>=35&&rhrUp<=1&&S.consec===0){k='room';why.push('HRV '+Math.round(S.hrv)+' ms, resting HR at baseline');}
    else why.push('Everything inside your normal range');
  }
  return {k,why,plan:PLANS[k]};
}

/* ═══ 10. SCORE ═══ */
function calcScore(){
  const h=S.hrv7,r=mean(S.rhrV.slice(-7)),d=mean(S.deep7),v=S.vo2,resp=S.resp;
  const hs=h>=40?35:h>=25?35*((h-25)/15):0;
  const rs=r<=0?10:Math.max(0,Math.min(20,20*(1-(r-55)/15)));
  const ds=d<=0?0:Math.min(20,20*(d/0.9));
  const vs=v<=0?7.5:Math.max(0,Math.min(15,15*((v-32)/10)));
  const bs=resp<=0?2.5:resp<14?5:resp<15?3:1;
  const bp=(DB.get('bp_log')||[]).filter(x=>x.date>=addDays(TODAY,-14)).pop();
  const ps=bp?((bp.sys<130&&bp.dia<85)?5:(bp.sys<140&&bp.dia<90)?3:1):2.5;
  return {total:Math.max(0,Math.min(100,Math.round(hs+rs+ds+vs+bs+ps))),
    parts:[['HRV',hs,35],['Resting HR',rs,20],['Sleep',ds,20],['VO2max',vs,15],['Breathing',bs,5],['Blood pressure',ps,5]]};
}

const CORE_POOL=['dead_bug','bird_dog','plank','side_plank','hollow_hold','hang_knee','farmer_carry','suitcase_carry'];
const FAMILY={farmer_carry:'carry',suitcase_carry:'carry',plank:'plank',side_plank:'plank',
  hollow_hold:'flexion',hang_knee:'flexion',dead_bug:'antiext',bird_dog:'antiext'};
/* One per muscle, compounds first. Isolation only if there is room. */
const MUSCLE_ORDER={
  push:['chest','shoulders','triceps'],
  pull:['back','biceps'],
  legs:['quads','hamstrings','glutes','calves']
};
const PRESSURE_GATED=['hollow_hold','hang_knee'];
const ROTATION=['push','pull','legs'];

function coreAvailable(){
  return CORE_POOL.filter(id=>{
    const e=EX_DB[id];if(!e)return false;
    if(PRESSURE_GATED.includes(id)&&!S.pelvic)return false;
    return e.phases.includes(S.phase);
  });
}
function applyCoreLevel(id,def){
  const L=CORE_LEVELS[S.core];
  if(def.muscle!=='core')return null;
  if(/carry/.test(id))return{sets:L.sets,reps:L.steps+' steps'};
  if(['plank','side_plank','hollow_hold','dead_bug','bird_dog'].includes(id)&&/plank|hold/.test(id))
    return{sets:L.sets,reps:L.secs+'s'};
  if(['plank','side_plank','hollow_hold'].includes(id))return{sets:L.sets,reps:L.secs+'s'};
  return{sets:L.sets,reps:String(L.reps)};
}
function nextType(){
  const man=DB.get('manual_session_type_'+TODAY);
  if(man)return man;
  const lastReal=realSessions().slice(-1)[0];
  if(!lastReal)return 'push';
  const i=ROTATION.indexOf(lastReal.type);
  return ROTATION[(i+1)%3];
}
function pickCore(n){
  const pool=coreAvailable();
  if(!pool.length)return [];
  const seed=realSessions().length;
  const out=[],used=new Set();
  for(let step=0;step<pool.length&&out.length<n;step++){
    const id=pool[(seed*2+step)%pool.length];
    const fam=FAMILY[id]||id;
    if(used.has(fam)||out.includes(id))continue;
    used.add(fam);out.push(id);
  }
  return out;
}
function buildSession(){
  const type=nextType();
  const seed=realSessions().length;
  const byMuscle={};
  Object.entries(EX_DB).forEach(([id,e])=>{
    if(e.cat!==type||e.muscle==='core')return;
    if(!e.phases.includes(S.phase)||e.neck_ok===false)return;
    (byMuscle[e.muscle]=byMuscle[e.muscle]||[]).push(id);
  });
  const order=(MUSCLE_ORDER[type]||Object.keys(byMuscle)).filter(m=>byMuscle[m]);
  Object.keys(byMuscle).forEach(m=>{if(!order.includes(m))order.push(m);});

  const picked=[];
  order.forEach(m=>{ if(picked.length<4) picked.push(byMuscle[m][seed%byMuscle[m].length]); });
  // Fewer than four muscle groups (pull has two): keep filling from the
  // biggest groups first so the session does not come up short.
  for(let round=1;picked.length<4&&round<4;round++){
    for(const m of order){
      if(picked.length>=4)break;
      const list=byMuscle[m];
      if(list.length<=round)continue;
      const alt=list[(seed+round)%list.length];
      if(!picked.includes(alt))picked.push(alt);
    }
  }
  return {type,exercises:picked,core:pickCore(2)};
}
function targetFor(id){
  const e=EX_DB[id];
  const cl=applyCoreLevel(id,e);
  let sets=cl?cl.sets:(e.sets[S.phase]||3);
  let reps=cl?cl.reps:(e.reps[S.phase]||'8-10');
  if(S.verdict.k==='ease')sets=Math.max(2,sets-1);
  if(S.deload)sets=Math.max(2,sets-1);
  const kg=(DB.get('prev_weights')||{})[id];
  return {sets,reps,kg:e.bw?0:(kg||e.kg)};
}

/* ═══ 13. PROGRESSION — decoupled from HRV ═══ */
function progressionHint(id){
  const log=sessions().filter(s=>s.exercises&&s.exercises[id]).slice(-2);
  if(log.length<2)return null;
  const clean=log.every(s=>s.exercises[id].every(x=>x.done));
  if(!clean)return log[1].exercises[id].every(x=>x.done)?'One more clean session and you step up':null;
  const e=EX_DB[id];
  if(S.verdict.k==='ease'||S.verdict.k==='rest')return 'Ready to step up — hold today, raise next session';
  if(e.muscle==='core')return /carry|steps/.test(String(e.reps[S.phase]))?'Ready: add 10 steps':'Ready: add 5–10s or 2 reps';
  if(e.bw)return 'Ready: add 1–2 reps per set';
  const t=targetFor(id);
  const hi=parseInt(String(t.reps).match(/(\d+)\s*$/)?.[1]||'0',10);
  const lastReps=Math.max(...log[1].exercises[id].map(x=>+x.reps||0));
  if(hi&&lastReps<hi)return 'Ready: same weight, work up to '+hi+' reps';
  return 'Ready: try '+(t.kg+0.5).toFixed(1)+' kg, back to the bottom of the range';
}

function weekStart(){const d=new Date(TODAY);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function aeroThisWeek(){const ws=weekStart();return aeroLog().filter(e=>e.date>=ws);}

function aeroYesterday(){return aeroLog().some(e=>e.date===addDays(TODAY,-1));}

/* How many blocks a week your own numbers currently support.
   Two is the floor. Extra days are earned, not assumed. */
function aeroTarget(){
  const base=2,why=[],blocks=aeroLog();
  if(blocks.length<6)return {target:base,why:['Building the base · '+blocks.length+' of 6 blocks logged'],locked:true};
  if(blocks.slice(-6).filter(b=>b.minutes>=15).length<5)
    return {target:base,why:['Not consistently at 15 min yet'],locked:true};
  if(blocks.slice(-8).some(b=>b.pelvic))
    return {target:base,why:['Pelvic symptoms logged recently · holding at two'],locked:true};
  const rhr7=mean(S.rhrV.slice(-7));
  if(S.hrv7<35)why.push('7-day HRV '+(S.hrv7?S.hrv7.toFixed(1):'-')+' ms, under 35');
  if(!(rhr7>0&&rhr7<=63))why.push('7-day resting HR '+(rhr7?rhr7.toFixed(1):'-')+', over 63');
  if(S.hrv7&&S.hrvPrev7&&S.hrvPrev7-S.hrv7>=2)why.push('HRV trending down');
  if(why.length)return {target:base,why,locked:true};
  const weeksAtFull=Math.max(0,aeroWeek()-2);
  const target=weeksAtFull>=6?4:weeksAtFull>=3?3:2;
  return {target,why:['HRV '+S.hrv7.toFixed(1)+' ms, resting HR '+rhr7.toFixed(1)+' · room for '+target+' this week'],locked:false};
}
/* Shows exactly which gate is holding the third block back. */
function unlockPanel(T){
  const blocks=aeroLog(),rhr7=mean(S.rhrV.slice(-7));
  const gates=[
    ['6 blocks logged',blocks.length>=6,blocks.length+' / 6'],
    ['15 min or more',blocks.slice(-6).filter(b=>b.minutes>=15).length>=5,blocks.slice(-6).filter(b=>b.minutes>=15).length+' / 5 recent'],
    ['No pelvic symptoms',!blocks.slice(-8).some(b=>b.pelvic),'last 8 blocks'],
    ['7-day HRV 35+',S.hrv7>=35,(S.hrv7?S.hrv7.toFixed(1):'-')+' ms'],
    ['7-day resting HR 63 or under',rhr7>0&&rhr7<=63,(rhr7?rhr7.toFixed(1):'-')+' bpm']
  ];
  if(!T.locked)return '<div class="muted" style="margin-top:11px;padding-top:10px;border-top:1px solid var(--line);color:var(--green)">All gates clear · extra blocks unlocked</div>';
  return '<div style="margin-top:11px;padding-top:10px;border-top:1px solid var(--line)">'+
    '<div class="muted" style="margin-bottom:7px">A third block a week unlocks when all of these are true:</div>'+
    gates.map(([l,ok,v])=>'<div class="row" style="padding:3px 0"><span class="muted" style="color:'+(ok?'var(--green)':'var(--t3)')+'">'+(ok?'\u2713':'\u00B7')+' '+l+'</span>'+
      '<span class="muted">'+v+'</span></div>').join('')+'</div>';
}

let ctx=null,scheduled=[],deadline=0,wake=null;
function getCtx(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx;}catch(e){return null;}}
['touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>getCtx(),{passive:true}));
function tone(c,f,at,dur,vol){
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.02);g.gain.linearRampToValueAtTime(0,at+dur);
  o.start(at);o.stop(at+dur+.03);return o;
}
const CHIME=[[800,0,.16],[1000,.22,.16],[1250,.44,.30]];
function scheduleAlarm(secs){
  cancelAlarm();
  deadline=Date.now()+secs*1000;
  const c=getCtx();
  if(!c||c.state!=='running')return false;   // suspended clock never fires
  const base=c.currentTime+Math.max(0,secs);
  CHIME.forEach(([f,o,d])=>scheduled.push(tone(c,f,base+o,d,.32)));
  return true;
}
function cancelAlarm(){scheduled.forEach(o=>{try{o.stop();}catch(e){}});scheduled=[];deadline=0;}
/* Timer ran out on its own: drop our handle but let the sound play. */
function releaseAlarm(){scheduled=[];deadline=0;}
function alarmScheduled(){return scheduled.length>0;}
function beepNow(){
  const c=getCtx();if(!c)return;
  const go=()=>{const t=c.currentTime;CHIME.forEach(([f,o,d])=>tone(c,f,t+o,d,.32));};
  c.state==='running'?go():c.resume().then(go).catch(()=>{});
  if(navigator.vibrate)navigator.vibrate([300,100,300]);
}
function keepAwake(on){
  if(on&&navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(l=>wake=l).catch(()=>{});
  if(!on&&wake){try{wake.release();}catch(e){}wake=null;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(deadline&&Date.now()>=deadline){cancelAlarm();beepNow();stopRest();}
});

function sparkline(id,data,col){
  const c=el(id);if(!c||!c.parentElement)return;
  const w=c.parentElement.offsetWidth;if(!w||w<20){setTimeout(()=>sparkline(id,data,col),300);return;}
  const dpr=window.devicePixelRatio||1,hh=c.dataset.h?+c.dataset.h:34;
  c.width=w*dpr;c.height=hh*dpr;
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,hh);
  if(data.length<2)return;
  const mn=Math.min(...data),mx=Math.max(...data),rg=(mx-mn)||1,pad=3;
  const X=i=>(i/(data.length-1))*w, Y=v=>pad+(hh-pad*2)-((v-mn)/rg)*(hh-pad*2);
  x.beginPath();data.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=col||'#7DA6F0';x.lineWidth=1.8;x.lineJoin='round';x.stroke();
  x.beginPath();x.arc(X(data.length-1),Y(data[data.length-1]),2.6,0,7);x.fillStyle=col||'#9A9AA5';x.fill();
}

/* ═══ GUIDED WORKOUT ═══

let G={plan:[],i:0,left:0,timer:null,running:false};

function guideBuild(){
  const d=sessionDraft(),plan=[];
  d.ids.forEach((id,ei)=>{
    const t=targetFor(id);
    const secs=parseInt((String(t.reps).match(/^([0-9]+)s/)||[])[1]||'0',10);
    for(let sN=0;sN<t.sets;sN++){
      plan.push({kind:'work',id,set:sN+1,sets:t.sets,secs,target:(t.kg?t.kg+' kg \u00D7 ':'')+t.reps});
      const lastOverall=(ei===d.ids.length-1)&&(sN===t.sets-1);
      if(!lastOverall)plan.push({kind:'rest',id,sec:restFor(id)});
    }
  });
  return plan;
}

function guideMain(){
  const s=G.plan[G.i];
  if(!s)return;
  const a=s.kind==='work'?actual(s.id,s.set-1):null;
  const timed=(s.kind==='rest')||(s.kind==='work'&&a&&a.timed);
  if(!timed){markGuideSet(s);return guideNext();}
  if(G.running){clearInterval(G.timer);G.running=false;cancelAlarm();el('g-main').textContent='Resume';return;}
  const secs=G.left||(s.kind==='rest'?s.sec:a.reps);
  G.left=secs;G.running=true;
  const ok=scheduleAlarm(secs);
  const end=deadline;

  G.timer=setInterval(()=>{
    G.left=Math.max(0,Math.ceil((end-Date.now())/1000));

      clearInterval(G.timer);G.running=false;
      if(!ok)beepNow();
      if(navigator.vibrate)navigator.vibrate([300,100,300]);
      releaseAlarm();
      if(s.kind==='work')markGuideSet(s);
      setTimeout(()=>guideNext(),900);

  },200);

/* Timed exercises (planks, holds, carries) get their own countdown. */
function runHold(id,secs){
  const e=EX_DB[id];
  const ok=scheduleAlarm(secs);keepAwake(true);
  if(!ok)setTimeout(beepNow,secs*1000);
  openSheet('<div style="padding:0 20px 24px;text-align:center">'+
    '<div class="muted" style="letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Hold</div>'+
    '<div style="font-size:17px;margin-bottom:4px">'+h(e.name)+'</div>'+
    '<div class="muted" style="margin-bottom:10px">'+h(e.note||'')+'</div>'+
    '<div class="clock" id="hold-clock" style="font-size:58px">'+fmt(secs)+'</div>'+
    '<button class="btn btn-go" style="width:100%;margin:12px 0 0" onclick="endHold(true)">Done \u2713</button>'+
    '<button class="btn btn-quiet" style="width:100%;margin:6px 0 0" onclick="endHold(false)">Cancel</button></div>');
  window._holdId=id;
  clearInterval(window._hold);
  window._hold=setInterval(()=>{
    const left=Math.max(0,Math.round((deadline-Date.now())/1000));
    const c=el('hold-clock');if(c)c.textContent=fmt(left);
    if(left<=0){clearInterval(window._hold);if(c)c.textContent='0:00';releaseAlarm();if(navigator.vibrate)navigator.vibrate([300,100,300]);}
  },250);
}
function endHold(done){
  clearInterval(window._hold);cancelAlarm();keepAwake(false);closeSheet();
  if(!done)return;
  const id=window._holdId,d=sessionDraft();
  d.marks[id]=d.marks[id]||{};
  const t=targetFor(id);
  for(let i=0;i<t.sets;i++){if(!d.marks[id][i]){d.marks[id][i]=true;break;}}
  saveDraft();renderSession();startRest(id);
}
function restFor(id){
  const base=(DB.get('settings')||{restSec:90}).restSec||90;
  const e=EX_DB[id];
  return (e&&e.muscle==='core')?Math.round(base*0.66):base;
}
function startRest(id){
  const sec=id?restFor(id):((DB.get('settings')||{restSec:90}).restSec||90);
  const ok=scheduleAlarm(sec);keepAwake(true);
  const t=el('rest-timer');if(!t)return;
  t.innerHTML='<div class="card"><div class="clock" id="rt">'+fmt(sec)+'</div>'+
    '<button class="btn btn-quiet" style="width:100%;margin:0" onclick="stopRest()">Skip rest</button></div>';
  clearInterval(window._rt);
  const end=deadline;
  window._rt=setInterval(()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const e=el('rt');if(e)e.textContent=fmt(left);
    if(Date.now()>=end){
      clearInterval(window._rt);
      if(!ok)beepNow();                 // scheduling failed: sound it now
      if(navigator.vibrate)navigator.vibrate([300,100,300]);
      releaseAlarm();                   // let the scheduled chime finish
      keepAwake(false);
      const w=el('rest-timer');if(w)w.innerHTML='';
    }
  },200);
}
function stopRest(){clearInterval(window._rt);cancelAlarm();keepAwake(false);const t=el('rest-timer');if(t)t.innerHTML='';}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function saveSession(){
  const d=sessionDraft();
  const ex={};
  d.ids.forEach(id=>{
    const t=targetFor(id),arr=[];
    for(let i=0;i<t.sets;i++){
      const a=(d.actuals&&d.actuals[id]&&d.actuals[id][i])||null;
      arr.push({done:!!(d.marks[id]&&d.marks[id][i]),
        reps:a?a.reps:(parseInt(String(t.reps))||0), kg:a?a.kg:t.kg});
    }
    ex[id]=arr;
  });
  const log=DB.get('session_log')||[];
  log.push({date:TODAY,type:d.type,exercises:ex,phase:S.phase,hrv:S.hrv||null,ts:Date.now()});
  DB.set('session_log',log);
  const pw=DB.get('prev_weights')||{};
  d.ids.forEach(id=>{
    const a=d.actuals&&d.actuals[id]&&d.actuals[id][0];
    const kg=a&&a.kg?a.kg:targetFor(id).kg;
    if(kg)pw[id]=kg;

function aeroToggle(){

function metricCard(name,cur,unit,data,better,dec){

  const good=better==='down'?diff<0:diff>0;
  const col=Math.abs(diff)<(dec?0.3:0.5)?'#9A9AA5':good?'#4ADE80':'#F87171';
  const id='c-'+name.replace(/\W/g,'');
  const mn=Math.min(...data),mx=Math.max(...data);
  const half=Math.floor(data.length/2);
  const trend=mean(data.slice(half))-mean(data.slice(0,half));
  setTimeout(()=>{const c=el(id);if(c)c.dataset.h=72;sparkline(id,data,col);},0);
  return '<div class="metric"><div class="m-top">'+
    '<div><div class="m-name">'+name+'</div><div class="m-val">'+cur.toFixed(dec||0)+'<span class="hero-unit">'+unit+'</span></div></div>'+
    '<div><div class="m-delta" style="color:'+col+'">'+(diff>0?'+':'')+diff.toFixed(dec||1)+'</div>'+
    '<div class="m-since">over '+data.length+' readings</div></div></div>'+
    '<canvas id="'+id+'" style="height:72px;margin-top:10px"></canvas>'+
    '<div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">'+
      '<span class="muted">low '+mn.toFixed(dec||0)+'</span>'+

      '<span class="muted">2nd half '+(trend>0?'+':'')+trend.toFixed(1)+'</span></div>'+
    '</div>';
}

/* ═══ 24. PATTERNS — correlations from your own data ═══ */
function pearson(a,b){
  const n=Math.min(a.length,b.length);if(n<8)return null;
  const x=a.slice(-n),y=b.slice(-n);
  const mx=mean(x),my=mean(y);
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){const p=x[i]-mx,q=y[i]-my;num+=p*q;dx+=p*p;dy+=q*q;}
  return (dx&&dy)?num/Math.sqrt(dx*dy):null;
}
function pairedSeries(nameA,nameB,lagB){
  const A=Object.fromEntries(metricSeries(nameA,90));
  const B=nameB==='deep'||nameB==='total'
    ? Object.fromEntries(sleepRecords().map(r=>[(r.date||'').slice(0,10),nameB==='deep'?r.deep:r.totalSleep]))
    : Object.fromEntries(metricSeries(nameB,90));
  const xs=[],ys=[];
  Object.keys(A).sort().forEach(d=>{
    const k=lagB?addDays(d,lagB):d;
    if(B[k]>0&&A[d]>0){xs.push(A[d]);ys.push(B[k]);}
  });
  return [xs,ys];
}
function buildPatterns(){
  const out=[];
  const add=(title,r,n,text)=>{if(r===null)return;out.push({title,r,n,text});};

  let [act,hrvNext]=pairedSeries('active_energy','heart_rate_variability',1);
  add('Activity today → HRV tomorrow',pearson(act,hrvNext),act.length,
    'Volume on one day and how your nervous system reads the next morning.');

  let [tot,hrvSame]=pairedSeries('heart_rate_variability','total',0);
  add('Total sleep → HRV',pearson(hrvSame,tot),tot.length,
    'Hours asleep against the same morning\u2019s reading.');

  let [hrvD,deepD]=pairedSeries('heart_rate_variability','deep',0);
  add('Deep sleep → HRV',pearson(hrvD,deepD),deepD.length,
    'Deep sleep is an outcome, not a dial you can turn.');

  const rhr=vals('resting_heart_rate',90),hv=vals('heart_rate_variability',90);
  add('Resting HR ↔ HRV',pearson(rhr,hv),Math.min(rhr.length,hv.length),
    'These normally move opposite each other. If they stop doing that, something is off in the data.');

  return out.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
}
function strengthWord(r){
  const a=Math.abs(r);
  return a<0.15?'no relationship':a<0.3?'weak':a<0.5?'moderate':'strong';
}
function renderPatterns(){
  const pats=buildPatterns();
  if(!pats.length)return '<div class="card"><div class="muted">Not enough overlapping data yet — patterns need about two weeks.</div></div>';
  return pats.map(p=>{
    const col=Math.abs(p.r)<0.15?'var(--t3)':p.r>0?'var(--green)':'var(--red)';
    return '<div class="card"><div class="row" style="align-items:baseline">'+
      '<div style="font-size:12px">'+p.title+'</div>'+
      '<div style="color:'+col+';font-size:13px">r = '+p.r.toFixed(2)+'</div></div>'+
      '<div class="muted" style="margin-top:6px">'+strengthWord(p.r)+' \u00B7 '+p.n+' paired days \u00B7 '+p.text+'</div></div>';
  }).join('');
}

/* ═══ 25. RETROSPECT — did last week's verdict hold up ═══ */
function logVerdict(){
  const l=DB.get('advice_log')||[];
  if(l.some(a=>a.date===TODAY))return;
  l.push({date:TODAY,state:S.verdict.k,why:S.verdict.why[0]||'',hrv:S.hrv||null,ts:Date.now()});
  DB.set('advice_log',l.slice(-120));
}
function buildRetrospect(){
  const log=(DB.get('advice_log')||[]).filter(a=>a.date<=addDays(TODAY,-7));
  if(!log.length)return '<div class="card"><div class="muted">Building history — the first look back appears after a week.</div></div>';

  const wk={};
  log.forEach(a=>{
    const d=new Date(a.date);d.setDate(d.getDate()-((d.getDay()+6)%7));
    const k=iso(d);(wk[k]=wk[k]||[]).push(a);
  });
  const weeks=Object.keys(wk).sort().slice(-4).reverse();
  const hrvBy=Object.fromEntries(metricSeries('heart_rate_variability',120));

  return weeks.map(w=>{
    const days=wk[w],end=addDays(w,6);
    const counts={};days.forEach(a=>counts[a.state]=(counts[a.state]||0)+1);
    const inWeek=[],nextWeek=[];
    Object.entries(hrvBy).forEach(([d,v])=>{
      if(d>=w&&d<=end)inWeek.push(v);
      if(d>addDays(end,0)&&d<=addDays(end,7))nextWeek.push(v);
    });
    const a=mean(inWeek),b=mean(nextWeek);
    const diff=(a&&b)?+(b-a).toFixed(1):null;
    const col=diff===null?'var(--t3)':diff>=1?'var(--green)':diff<=-1?'var(--red)':'var(--t2)';
    const word=diff===null?'no follow-up data':diff>=1?'HRV rose after':diff<=-1?'HRV fell after':'HRV flat after';
    const mix=Object.entries(counts).map(([k,n])=>n+'\u00D7 '+STATES[k].label.toLowerCase()).join(', ');
    return '<div class="card"><div class="row" style="align-items:baseline">'+
      '<div style="font-size:12px">Week of '+w+'</div>'+
      '<div style="color:'+col+';font-size:12px">'+(diff===null?'—':(diff>0?'+':'')+diff+' ms')+'</div></div>'+
      '<div class="muted" style="margin-top:6px">'+h(mix)+'</div>'+
      '<div class="muted" style="margin-top:4px;color:'+col+'">'+word+
        (a&&b?' ('+a.toFixed(1)+' \u2192 '+b.toFixed(1)+')':'')+'</div></div>';
  }).join('');
}

/* ═══ 26. MONTHLY SUMMARY ═══ */
function monthlySummary(){
  const from=addDays(TODAY,-30);
  const hrv=metricSeries('heart_rate_variability',30).map(e=>e[1]);
  const rhr=vals('resting_heart_rate',30);
  const vo2=vals('vo2_max',30);
  const resp=vals('respiratory_rate',30);
  const sl=sleepRecords().filter(r=>(r.date||'').slice(0,10)>=from);
  const sess=sessions().filter(s=>s.date>=from);
  const train=sess.filter(s=>['push','pull','legs'].includes(s.type)&&!s.skipped);
  const aero=aeroLog().filter(a=>a.date>=from);
  const wt=(DB.get('weight_log')||[]).filter(r=>r.date>=from);
  const bp=(DB.get('bp_log')||[]).filter(r=>r.date>=from);
  const adv=(DB.get('advice_log')||[]).filter(a=>a.date>=from);
  const st={};adv.forEach(a=>st[a.state]=(st[a.state]||0)+1);
  const wellDays=[];
  for(let i=0;i<30;i++){const k=addDays(TODAY,-i);const w=DB.get('wellness_'+k);if(w)wellDays.push(w);}

  return {
    period:from+' to '+TODAY,
    hrv:{mean:+mean(hrv).toFixed(1),min:hrv.length?Math.min(...hrv):null,max:hrv.length?Math.max(...hrv):null,
      readings:hrv.length,first7:+mean(hrv.slice(0,7)).toFixed(1),last7:+mean(hrv.slice(-7)).toFixed(1)},
    restingHr:{mean:+mean(rhr).toFixed(1),first7:+mean(rhr.slice(0,7)).toFixed(1),last7:+mean(rhr.slice(-7)).toFixed(1)},
    vo2max:{latest:vo2.length?vo2[vo2.length-1]:null,change:vo2.length>1?+(vo2[vo2.length-1]-vo2[0]).toFixed(1):null},
    respiratoryRate:+mean(resp).toFixed(2),
    sleep:{totalMean:+mean(sl.map(r=>r.totalSleep)).toFixed(2),deepMean:+mean(sl.map(r=>r.deep)).toFixed(2),
      nightsOver1h:sl.filter(r=>r.deep>=1).length,nightsUnder06:sl.filter(r=>r.deep<0.6).length,nights:sl.length},
    training:{sessions:train.length,skipped:sess.filter(s=>s.skipped).length,rest:sess.filter(s=>s.type==='rest').length,
      split:{push:train.filter(s=>s.type==='push').length,pull:train.filter(s=>s.type==='pull').length,legs:train.filter(s=>s.type==='legs').length},
      aerobicBlocks:aero.length,aerobicMinutes:+aero.reduce((a,b)=>a+(b.minutes||0),0).toFixed(0),
      pelvicSymptomsLogged:aero.filter(a=>a.pelvic).length},
    dayStates:st,
    phase:S.phase,coreLevel:S.core,
    weight:wt.length?{latest:wt[wt.length-1].kg,change:+(wt[wt.length-1].kg-wt[0].kg).toFixed(1),readings:wt.length}:null,
    bloodPressure:bp.length?{readings:bp.length,latest:bp[bp.length-1].sys+'/'+bp[bp.length-1].dia}:null,
    wellness:{energy:+mean(wellDays.map(w=>w.energy)).toFixed(1),muscles:+mean(wellDays.map(w=>w.muscle)).toFixed(1),
      mood:+mean(wellDays.map(w=>w.mood)).toFixed(1),daysLogged:wellDays.length},
    score:S.score.total,
    patterns:buildPatterns().map(p=>({relationship:p.title,r:+p.r.toFixed(2),pairedDays:p.n}))
  };
}

    .then(r=>{if(r.ok)navigator.serviceWorker.register('sw.js');}).catch(()=>{}));
}
